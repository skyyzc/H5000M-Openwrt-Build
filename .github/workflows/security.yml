name: 供应链安全

# Supply-chain security gates for the H5000M firmware build.
#
# This repository builds a *firmware image* people flash onto a router, so the
# threat model is not the usual "did my web app leak a dependency" one.  Three
# things actually matter here, and each maps to a job below:
#
#   1. The build runs with a WRITE token and a SIGNING KEY, and it downloads
#      ~150 upstream tarballs plus a dozen git trees.  A compromised action or a
#      malicious upstream would inherit that.  -> action Pinning (enforced by
#      zizmor/sha-lock in checks.yml) + Least Privilege + OIDC.
#   2. The published apk repository is what devices `apk add` from.  If it can
#      be swapped out, every device that installs a package is compromised.
#      -> Artifact Attestations + SBOM + SLSA provenance.
#   3. The workflows themselves are attack surface (script injection, pwn
#      requests, credential persistence).  -> zizmor, CodeQL, Scorecard.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, offset from the firmware build so the two never contend for the
    # same shared runner IPs (Dependency Review and Scorecard both hit APIs).
    - cron: '30 5 * * 1'
  workflow_dispatch:

# Default to NO permissions at all, then grant per job.  A workflow-level
# `contents: write` would hand every job — including any future third-party
# action added carelessly — the ability to push to master.
permissions: {}

# Concurrency: a security scan results are per-commit, and superseded runs are
# pure waste.  cancel-in-progress for PRs only, so a `master` scan always
# finishes (Scorecard publishes to the public API and should not be truncated).
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis of the workflows themselves.
  # ---------------------------------------------------------------------------
  zizmor:
    name: 工作流静态审计（zizmor）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run zizmor
        # zizmor is the dedicated GitHub Actions auditor: template injection,
        # unpinned third-party actions, credential persistence, over-broad
        # permissions, cache poisoning, known action pwn-requests.
        #
        # This is a REAL gate, not advisory: `continue-on-error` used to make it
        # purely decorative, which is how the four template-injection findings
        # and three cache-poisoning findings in this very repository went
        # unnoticed.  A finding now fails the job.
        #
        # `--persona=auditor` matches .github/zizmor.yml, and `--min-severity`
        # keeps the signal at the level the config documents.
        run: |
          set -euo pipefail
          # Hash-pinned, like the checks.yml job (see the note there).
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements-zizmor.txt
          zizmor --persona=auditor --format sarif .github/workflows/ > zizmor.sarif
          echo "--- human-readable summary ---"
          zizmor --persona=auditor --format plain .github/workflows/

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # SAST over the shell/JS we actually ship.
  # ---------------------------------------------------------------------------
      # 失败时自动产出诊断报告（可复用的 Composite Action）
      # —— 三个 workflow 此前没有任何失败诊断步骤，红了的 run 只显示
      #    "exit code 1"，原因必须本地复现。
      - name: 失败诊断
        if: failure()
        uses: ./.github/actions/diagnose
        with:
          title: zizmor 审计失败
  codeql:
    name: CodeQL 静态分析
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Matrix over languages: each is an independent analysis, and a failure
        # in one must not hide the other (fail-fast: false).
        # `actions` analyses the workflow YAML itself.
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # The shipped JS is LuCI view code plus the build scripts; the
          # security-extended suite is worth the extra minutes for a component
          # whose output runs as root on a router.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------------------
  # Dependency Review — PR-only, because it compares the base against the head.
  # ---------------------------------------------------------------------------
      # 失败时自动产出诊断报告（可复用的 Composite Action）
      # —— 三个 workflow 此前没有任何失败诊断步骤，红了的 run 只显示
      #    "exit code 1"，原因必须本地复现。
      - name: 失败诊断
        if: failure()
        uses: ./.github/actions/diagnose
        with:
          title: CodeQL 失败
  dependency-review:
    name: 依赖审查
    # A pull_request event is required: the action diffs the dependency
    # manifests between base and head, which does not exist on a push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Dependency Review requires the repository's Dependency Graph to be
      # enabled (Settings -> Security -> Dependency graph).  Without it the
      # action fails outright with
      #
      #   Dependency review is not supported on this repository.
      #
      # which is a repository setting, not a defect in the change under review —
      # so a missing graph must not block every PR.  `continue-on-error` is
      # deliberately NOT used: that would hide a real vulnerability finding once
      # the graph IS enabled.  Instead the step checks the precondition and
      # reports clearly, so the gate becomes active the moment the setting is
      # switched on and nothing else has to change.
      - name: Check the Dependency Graph precondition
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Probe the SBOM endpoint: it requires the Dependency Graph and
          # returns the repository's own package list when it is on.  An empty
          # `compare` range also succeeds when the graph is OFF, so that
          # endpoint cannot distinguish the two states; this one can.
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dependency Graph is enabled; Dependency Review will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is not enabled for this repository, so Dependency Review cannot run. Enable it at https://github.com/${GITHUB_REPOSITORY}/settings/security_analysis (Settings -> Security -> Dependency graph). This gate activates automatically once it is on."
          fi

      - name: Dependency review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: a PR that introduces a known-vulnerable or
          # non-allowlisted-licence dependency must not merge.  `deny` lists are
          # checked before `allow`.
          fail-on-severity: high
          # This project ships GPL/LGPL/Apache components; a copyleft licence is
          # not a defect for a firmware image, but a *new* one deserves a look.
          comment-summary-in-pr: on-failure
          # A firmware build fetches sources via PKG_SOURCE/PKG_HASH rather than
          # a package-manager lockfile, so the useful signal is the feeds and
          # clone list.  Review them explicitly.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/*,
            pkg:githubactions/github/*

  # ---------------------------------------------------------------------------
  # OpenSSF Scorecard — the external, independent check on repo hygiene.
  # ---------------------------------------------------------------------------
      # 失败时自动产出诊断报告（可复用的 Composite Action）
      # —— 三个 workflow 此前没有任何失败诊断步骤，红了的 run 只显示
      #    "exit code 1"，原因必须本地复现。
      - name: 失败诊断
        if: failure()
        uses: ./.github/actions/diagnose
        with:
          title: 依赖审查失败
  scorecard:
    name: OpenSSF Scorecard
    # Only on the default branch: Scorecard publishes results to the public
    # OpenSSF API, and a PR run would report on a branch that is not the
    # project's real posture.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The minimum Scorecard needs.  `id-token: write` is for OIDC — results
      # are published with a signed token rather than a PAT.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publish so the badge and the public API reflect this repo, and so
          # the "Maintained"/"Dangerous-Workflow" checks are visible without
          # anyone running anything.
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # SBOM + build provenance USED TO LIVE HERE, as the `attest:` job.
  # It now lives in attest.yml, and it had to move: ossf/scorecard-action
  # refuses to publish results from a workflow that contains any OTHER job
  # holding `id-token:` — Scorecard needs OIDC to sign its submission and the
  # attestation job needs it to sign artefacts, so one of them had to leave.
  # Scorecard only downgraded that refusal to a warning, which is why its job
  # above reports success while the public scorecard has silently not been
  # updating.  From run 37309310016:
  #
  #   workflow verification failed: workflow has a non-scorecard job with
  #   id-token permissions
  #
  # The new file also triggers off the build's completion rather than this
  # workflow's own schedule, which fired hours BEFORE the build had published
  # the index it was attesting.
  # ---------------------------------------------------------------------------
