name: 构建 H5000M 主线 OpenWrt 固件

# Mainline OpenWrt (openwrt/openwrt main) for the Hiveton H5000M.
# Weekly scheduled build + manual dispatch + tag releases.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC (Beijing 12:00)
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后创建或更新 GitHub Release'
        type: boolean
        default: true
      pinned:
        description: '使用固定的上游版本 而不是分支最新提交'
        type: boolean
        default: false
      runner_type:
        description: '运行器类型'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
      enable_wwand:
        description: '5G 拨号器 ddimension wwand —— 默认关闭：本机是 RG520N-CN + QModem，wwand 会与它抢数据面'
        # Default false, and it matters more than it looks.
        #
        # The scheduled run takes the `|| 'true'` branch below, so a `true`
        # default here meant the weekly build silently re-enabled wwand — and
        # with it the ddimension feed, whose libubus-lua-async turns
        # PROVIDES/CONFLICTS:=libubus-lua into a Kconfig loop that makes
        # defconfig drop the entire QModem chain.  verify_config() then refused
        # the build, which is how it was caught.
        #
        # wwand is mutually exclusive with QModem anyway (resolve_modem_stack
        # enforces it), so a true default here only ever produced failures.
        type: boolean
        default: false
      enable_qmodem:
        description: '5G 拨号器 QModem(FUjr) 栈 —— 启用后 wwand 自动关闭（RG520N-CN 走 QMI）'
        type: boolean
        default: true
      enable_oaf:
        description: 'OpenAppFilter 应用过滤（destan19，kmod 同树编译）'
        type: boolean
        default: true
      enable_higoros:
        description: 'HigoOS 海狗面板保留（higoros-overlay：厂商后端+前端+风扇控制器）—— 启用后 FAN789 风扇/网络插件自动关闭'
        type: boolean
        default: true
      # Two switches used to live here and now do not: `enable_mt5700m` and
      # `enable_ebpf_proxy_kernel`.  GitHub caps `workflow_dispatch` at TEN
      # inputs and this file carried TWELVE, which actionlint rejects outright
      # (build.yml:8:3: maximum number of inputs ... is 10 but 12 are provided)
      # and which made the whole dispatch surface an untested code path - the
      # gate went red every Monday and nobody saw it.
      #
      # Both moved to repository variables.  That is the same route
      # FEEDS_FOLLOW_TREE takes and for the same reason: the ceiling is on the
      # input LIST, not on the switches, so a switch that is read once a year
      # does not deserve one of ten slots.  Their defaults are unchanged -
      # MT5700M false, eBPF true - so a scheduled build compiles exactly what
      # it compiled before.  Flip either from the repo settings via
      # `vars.ENABLE_MT5700M` / `vars.ENABLE_EBPF_PROXY_KERNEL`.
      enable_adblock:
        description: 'Adblock 广告过滤'
        type: boolean
        default: false
      enable_dockerman:
        description: 'Docker 容器支持'
        type: boolean
        default: false
      enable_nikki:
        description: 'Nikki-RS 代理（clash-rs 内核，支持 eBPF 加速）'
        type: boolean
        default: false

  push:
    tags:
      - 'openwrt-*'
      - 'v*'

# Concurrency: a firmware build costs ~2-3 hours and a runner.  Two builds of
# the same ref must never run at once — they would contend for the ghcr.io cache
# tag and the release, and the second would waste the first's work.  Cancelling
# a superseded run is correct here: only the newest commit's output matters.
# NOT cancelled for a tag, because a tag build is a release and must finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege at the WORKFLOW level, then widen per job.  A top-level
# `contents: write` grants every job — and every third-party action inside
# them — the ability to push to master.  Only the `build` job needs write (to
# publish a Release) and only `publish-apk-repo` needs Pages; both say so
# themselves.  This is the single highest-value supply-chain change in the
# file: a compromised action now gets a read-only token.
permissions:
  contents: read

# Action majors are pinned deliberately: checkout v7 / upload-artifact v7 /
# cache v6 are the first majors whose action.yml declares `using: node24`.  The
# previous v4 majors declared node20, which GitHub has deprecated, and the tree
# used to paper over that with `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` — a
# transition-era escape hatch that runs a node20 action on a runtime it was
# never tested against.  Bumping the majors is the actual fix; do not
# reintroduce the env var, and do not downgrade below these majors.

jobs:
  # ---------------------------------------------------------------------------
  # The firmware build.
  # ---------------------------------------------------------------------------
  build:
    name: 构建固件
    permissions:
      contents: write
      # Push the build cache to GitHub Packages (ghcr.io).  Public packages are
      # free and, unlike actions/cache, have no 10 GB per-repository ceiling.
      packages: write
      # Attestations: OIDC is the signing identity and `attestations: write`
      # stores the provenance.  Neither is a long-lived secret, which is the
      # point — there is no release-signing key to leak or rotate.
      id-token: write
      attestations: write
    # No `needs:` — the checks now live in checks.yml, so each workflow runs on
    # its own.  local-build.sh still runs check_environment and verify_config
    # within the first few minutes of this job, which is where a broken
    # configuration is actually caught.
    #
    # A self-hosted runner must carry the labels linux, x64 and h5000m.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && fromJSON('["self-hosted","linux","x64","h5000m"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor artipacked: a checkout leaves GITHUB_TOKEN in .git/config,
          # where any later step — including a third-party package's build
          # script — can read it.  Nothing in these jobs pushes to the repo.
          persist-credentials: false

      - name: Free disk space
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          # `tool-cache` was renamed `preinstalled-runtimes` in v2.0.0.  The old
          # name still works, but the action prints
          #   "The 'tool-cache' input is deprecated; it was renamed to
          #    'preinstalled-runtimes'."
          # as a run-level warning annotation on EVERY build (observed on run
          # 36282274537), which buries the signals the warning audit exists to
          # surface.  Renamed here; the behaviour is identical.
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # The build tree reaches roughly 40 GB.  The runner has 16 GB of RAM,
          # so the swap file is not what keeps the build alive — but the ~4 GB it
          # occupies is disk this build cannot spare.
          swap-storage: true

      # Bind-mount the workspace at a short path and build from there.
      #
      # OpenWrt's rules.mk exports TMPDIR into the build tree, and Python's
      # multiprocessing.forkserver puts its AF_UNIX socket in TMPDIR.  Unix
      # socket paths are limited to 108 bytes.  The CI workspace is
      # /home/runner/work/<repo>/<repo>/openwrt — the repository name repeats, so
      # the prefix alone is 75 characters — and the socket path reached 145.  The
      # Rust host build died with "OSError: AF_UNIX path too long" for that
      # reason alone, and only in CI: a local checkout sits at a much shorter
      # path.  rules.mk exports TMPDIR itself, so setting it in the environment
      # does not help; the paths have to be short.
      - name: Build from a short path
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        run: |
          set -euo pipefail
          sudo mkdir -p /o
          sudo mount --bind "${GITHUB_WORKSPACE}" /o
          ln -sfn /o "${GITHUB_WORKSPACE}/short-path"
          echo "workspace is now reachable at /o ($(echo -n /o/openwrt | wc -c) chars for the source tree)"
          ls /o | head -5

      - name: Report disk space
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        run: |
          echo "=== free space after cleanup ==="
          df -h / /mnt 2>/dev/null || df -h /
          echo "=== largest free mount ==="
          df -BG --output=avail,target / 2>/dev/null | tail -1

      - name: Install build dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner_type != 'self-hosted' }}
        # A hang here must not consume the whole 350-minute job budget.  The apt
        # call has its own timeouts now; this is the backstop.
        timeout-minutes: 20
        run: ./scripts/local-build.sh --install-deps

      - name: Resolve the upstream revision
        id: upstream
        env:
          # Passed through the environment, never interpolated into the shell.
          # `${{ ... }}` inside `run:` is text substitution BEFORE bash parses
          # the line, so any dispatch input would be attacker-controlled code
          # (zizmor: template-injection).  An env var is data.
          PINNED: ${{ github.event_name == 'workflow_dispatch' && inputs.pinned || false }}
        run: |
          set -euo pipefail
          . configs/upstream.env
          if [ "${PINNED}" = "true" ]; then
            rev="${OPENWRT_PINNED_REVISION}"
          else
            rev="$(git ls-remote "${OPENWRT_REPO_URL}" "refs/heads/${OPENWRT_REPO_BRANCH}" | cut -f1)"
          fi
          [ -n "$rev" ] || { echo "::error::could not resolve the upstream revision"; exit 1; }
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "upstream revision: ${rev}"

      # The toolchain is the longest single phase of the build, so it is cached.
      #
      # It is cached as an ARCHIVE outside the source tree, not as
      # openwrt/staging_dir itself: caching that path makes the restore create
      # openwrt/ before anything else runs, after which prepare_source's
      # `git clone` dies with "destination path already exists and is not an
      # empty directory" — which is exactly what happened the first time this
      # cache was added.  local-build.sh unpacks the archive after the clone.
      #
      # Keyed on the configuration first, the revision second, and WITH a
      # restore-keys fallback.
      #
      # Keying on the revision alone made this cache nearly useless: upstream
      # main moves every day, so the key almost never matched — the one
      # verification run after the cache was first written already missed,
      # because main had advanced from b88dfb64 to 2ed2c210 in the meantime.
      #
      # What the toolchain actually depends on is the target configuration
      # (toolchain versions, target and subtarget), not the day's revision, so
      # that is what the key is built from.  Restoring a slightly older
      # toolchain is safe: OpenWrt's stamps live in version-named directories
      # under build_dir/toolchain-<target>_gcc-<ver>_musl/, tar preserves
      # mtimes, and make rebuilds anything whose Makefile or patches are newer
      # than its .built stamp.  A toolchain that is genuinely out of date
      # therefore rebuilds itself instead of being used.
      # Cache-poisoning mitigation (zizmor: cache-poisoning).
      #
      # This workflow PUBLISHES a firmware image and a package repository, so a
      # cache entry is an input to a trusted release.  `actions/cache` could
      # otherwise be written by an untrusted run (a fork PR or any ref) and then
      # consumed here, which would let that run influence what gets shipped.
      #
      # The official pattern: `restore` only, and `save` guarded to trusted refs.
      # Split into two steps so a PR can READ an existing cache but can never
      # WRITE one.  The build below is unaffected on master/tags.
      - name: Restore toolchain
        id: toolchain-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain-cache
          key: h5000m-toolchain-${{ hashFiles('configs/h5000m.config', 'feeds.conf.default') }}-${{ steps.upstream.outputs.rev }}
          restore-keys: |
            h5000m-toolchain-${{ hashFiles('configs/h5000m.config', 'feeds.conf.default') }}-
            h5000m-toolchain-

      - name: Save toolchain
        # Only from a trusted ref: `refs/heads/master` or a release tag.  A pull
        # request — including one from a fork — must not be able to seed a cache
        # that a later trusted build will unpack.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain-cache
          key: h5000m-toolchain-${{ hashFiles('configs/h5000m.config', 'feeds.conf.default') }}-${{ steps.upstream.outputs.rev }}

      - name: Restore download cache
        id: dl-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/dl
          # Deliberately NOT keyed on the upstream revision.  Downloads are
          # identified by name and hash, so a tarball fetched for one revision is
          # exactly the same file in the next; adding the revision produced a
          # second 3.1 GB entry per run for no benefit and pushed the repository
          # towards its 10 GB cache ceiling.
          key: h5000m-dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: h5000m-dl-

      - name: Save download cache
        # Same cache-poisoning rule as the toolchain above: trusted refs only.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openwrt/dl
          key: h5000m-dl-${{ hashFiles('feeds.conf.default') }}

      # The build tree is the expensive part: 40 GB of per-package build
      # directories and their .built stamps.  actions/cache cannot hold it —
      # 10 GB per repository — so it goes to ghcr.io, which has no such ceiling
      # and is free for public packages.  Only worth doing at all because the
      # source mtimes are normalised: OpenWrt keys its stamps on a hash of path
      # plus mtime, so without that every stamp would miss on a fresh clone.
      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Restore build cache from GitHub Packages
        id: buildcache
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')/buildcache"
          tag="$(sha256sum configs/h5000m.config feeds.conf.default | sha256sum | cut -c1-16)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # `github.actor` is a login name, but it reaches the shell only via
          # the environment: interpolating it here would be template injection
          # (zizmor flags it as High confidence because the actor string is
          # attacker-influenced in a fork PR).  The token itself likewise goes
          # through the environment rather than being pasted into the script.
          printf '%s' "${GH_TOKEN}" | oras login ghcr.io -u "${GH_ACTOR}" --password-stdin
          # Clean slate first.  A failed or interrupted pull leaves a partial
          # blob in .buildcache, and the build then picks it up and tries to
          # unpack it.  Measured on a real run: a truncated 9.4 GB tar cost the
          # entire transfer and was thrown away by the build's own zstd -t check
          # ("truncated or corrupt; ignoring it"), so all 342 packages were
          # rebuilt from scratch and the cache bought nothing.
          rm -rf .buildcache
          mkdir -p .buildcache
          # Keep oras's stderr: the previous version sent it to /dev/null, which
          # is precisely why a cache that came back truncated on every single run
          # could never be explained from the logs.
          if ! oras pull "${image}:${tag}" -o .buildcache; then
            echo "no build cache at ${image}:${tag} yet — this run will create it"
            rm -rf .buildcache
            mkdir -p .buildcache
            exit 0
          fi
          echo "downloaded $(du -sh .buildcache | cut -f1) from ${image}:${tag}"

          # Verify before the build trusts it.  A present-but-damaged cache is
          # worse than none at all: it costs the transfer and then fails late.
          # The sidecar alone is not sufficient — an interrupted pull carries a
          # partial sidecar too — so the archive's own integrity is checked as
          # well, and anything that fails is removed rather than left for the
          # build to find.
          reason=""
          if [ ! -f .buildcache/build-cache.sha256 ]; then
            reason="no checksum sidecar"
          elif ! ( cd .buildcache && sha256sum -c build-cache.sha256 ); then
            reason="checksum mismatch"
          elif command -v zstd >/dev/null 2>&1 \
            && ! zstd -t .buildcache/build-cache.tar.zst >/dev/null 2>&1; then
            reason="zstd integrity check failed"
          fi
          if [ -n "$reason" ]; then
            echo "::warning::build cache rejected (${reason}) — discarding it and building from scratch"
            if [ -f .buildcache/build-cache.tar.zst ]; then
              echo "rejected archive: $(stat -c '%s' .buildcache/build-cache.tar.zst) bytes"
              [ -f .buildcache/build-cache.sha256 ] \
                && echo "expected: $(cat .buildcache/build-cache.sha256)"
            fi
            rm -rf .buildcache
            mkdir -p .buildcache
          else
            echo "cache is complete and intact; the build will reuse it"
            echo "archive: $(stat -c '%s' .buildcache/build-cache.tar.zst) bytes, sha256 $(cut -d' ' -f1 .buildcache/build-cache.sha256)"
          fi

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ccache
            openwrt/.ccache
          key: h5000m-ccache-${{ github.run_id }}
          restore-keys: h5000m-ccache-

      - name: Save ccache
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ccache
            openwrt/.ccache
          key: h5000m-ccache-${{ github.run_id }}

      # The same signing key for every build.  secrets cannot be used in an
      # `if:`, so the step always runs and decides from the environment.
      - name: Install the apk signing key
        env:
          KEY: ${{ secrets.H5000M_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KEY}" ]; then
            mkdir -p .signing
            printf '%s\n' "${KEY}" > .signing/private-key.pem
            chmod 0600 .signing/private-key.pem
            echo "signing key installed ($(wc -c < .signing/private-key.pem) bytes)"
          else
            echo "::warning::H5000M_SIGNING_KEY is not set, so this build signs the package index with a key of its own. Devices flashed from a different build will report an untrusted signature and refuse the repository."
          fi

      - name: Build
        # Build from $BUILD_DIR: /o (the short bind mount created above) on a
        # github-hosted runner, the real workspace on a self-hosted one.  The
        # mount step is skipped there, so a hardcoded `working-directory: /o`
        # made every self-hosted run die on a directory that does not exist;
        # the script derives everything from its own location either way, and
        # on the hosted runner the short path is what keeps the AF_UNIX socket
        # under its 108-byte limit.
        env:
          BUILD_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && github.workspace || '/o' }}
          # Keep ccache from growing past what the repository's 10 GB cache
          # budget can hold alongside the toolchain and the downloads.
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: 'true'
          TOOLCHAIN_CACHE_ARCHIVE: ${{ github.workspace }}/.toolchain-cache/toolchain.tar.zst
          BUILD_CACHE_ARCHIVE: ${{ github.workspace }}/.buildcache/build-cache.tar.zst
          H5000M_SIGNING_KEY_FILE: ${{ github.workspace }}/.signing/private-key.pem
          THREADS: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && '8' || '4' }}
          # `format('{0}', <bool>)` renders "true"/"false".  Without it the usual
          # `cond && input || default` fallback would rewrite a boolean input of
          # false back into the default, because a non-empty string is truthy in
          # GitHub's expression language — i.e. a switch that silently cannot be
          # turned off.
          ENABLE_FANCONTROL: 'true'
          ENABLE_NETMODE: 'true'
          ENABLE_WWAND: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_wwand) || 'false' }}
          ENABLE_QMODEM: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_qmodem) || 'true' }}
          ENABLE_OAF: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_oaf) || 'true' }}
          ENABLE_HIGOROS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_higoros) || 'true' }}
          # Moved off the input list (see the note in `workflow_dispatch` above):
          # the ten-slot ceiling left no room, and a repository variable is the
          # same switch with the same default.
          ENABLE_MT5700M: ${{ vars.ENABLE_MT5700M || 'false' }}
          ENABLE_UPNP: 'true'
          ENABLE_THEME_ARGON: 'true'
          ENABLE_ADBLOCK: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_adblock) || 'false' }}
          ENABLE_REPO_PACKAGES: 'true'
          H5000M_APK_REPO_URL: ${{ vars.H5000M_APK_REPO_URL || '' }}
          ENABLE_DOCKERMAN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_dockerman) || 'false' }}
          ENABLE_NIKKI: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_nikki) || 'false' }}
          # True by default, as it was when it was an input.  Moved to a
          # repository variable along with MT5700M - see the note in
          # `workflow_dispatch` above for why.
          ENABLE_EBPF_PROXY_KERNEL: ${{ vars.ENABLE_EBPF_PROXY_KERNEL || 'true' }}
          ENABLE_OPENCLASH: ${{ vars.ENABLE_OPENCLASH || 'false' }}
          ENABLE_MOSDNS: 'true'
          ENABLE_HOMEPROXY: 'false'
          ENABLE_ADGUARDHOME: ${{ vars.ENABLE_ADGUARDHOME || 'false' }}
          # Passwall / Passwall2 — the front-ends and the whole core set they
          # depend on, built into this project's own apk repository so a single
          # `apk add luci-app-passwall` on the device is all it takes.
          #
          # VARIABLES, not dispatch inputs, and the reason is a hard GitHub
          # limit: `workflow_dispatch` accepts at most 10 inputs and this
          # workflow already declares 12.  Two more would make 14, and GitHub
          # rejects the excess rather than failing loudly.  These two are also
          # a per-repository decision that nobody flips per run — exactly the
          # case the ENABLE_OPENCLASH comment above describes — so vars is
          # where they belong.  Set them under Settings -> Secrets and
          # variables -> Actions -> Variables to turn either off.
          #
          # Default true: they are repository-only (=m), so they cost image
          # size nothing; see the ENABLE_PASSWALL block in local-build.sh.
          #
          # ★ Turning these OFF is not a supported configuration end to end.
          # The publish gate below ("front-ends a user may install") and
          # verify-apk-repo.sh both require luci-app-passwall, luci-app-passwall2
          # and their zh-cn translations to be present in the repository, with
          # no condition on this variable — so a build with either switch off
          # would assemble a smaller repository and then fail the gate, after
          # three hours.  They exist as variables so the decision is visible and
          # version-controlled, not because flipping them is routine.
          ENABLE_PASSWALL: ${{ vars.ENABLE_PASSWALL || 'true' }}
          ENABLE_PASSWALL2: ${{ vars.ENABLE_PASSWALL2 || 'true' }}
          # Optional, diagnostic.  `make world` reaches package/luci-app-* about
          # 160 minutes in, so a failure there costs a whole three-hour run to
          # find.  Naming packages here builds them (and their dependencies)
          # first, with the per-package logs on, so the same failure surfaces in
          # minutes.  Empty by default: the only thing that changes is order.
          PREBUILD_PACKAGES: ${{ vars.PREBUILD_PACKAGES || '' }}
          # Same reason as the Resolve step: an input must reach the shell as
          # data, not as interpolated source text.
          PINNED: ${{ github.event_name == 'workflow_dispatch' && inputs.pinned || false }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          args=()
          if [ "${PINNED:-false}" = "true" ]; then
            args+=(--pinned)
          fi

          # Where the firmware should look for this project's own apk
          # repository.  The repository is published as the apk-repo artifact;
          # for the entry to work it has to be served over HTTP at this URL.
          #
          # Derived from the repository the workflow is running in rather than
          # hard-coded, so a fork gets its own URL for free.  Override with the
          # H5000M_APK_REPO_URL repository variable (Settings -> Variables) if
          # you host it elsewhere — an entry pointing at a host that does not
          # serve the repository makes `apk update` report an error.
          #
          # It is a VARIABLE and not a dispatch input because GitHub allows at
          # most 10 `workflow_dispatch` inputs and this workflow needs the
          # budget for the switches people actually flip.  Same for
          # ENABLE_OPENCLASH / ENABLE_ADGUARDHOME / PREBUILD_PACKAGES below:
          # rare, per-repository decisions belong in vars, not in every run's
          # form.
          if [ -z "${H5000M_APK_REPO_URL:-}" ]; then
            export H5000M_APK_REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "apk repository URL for the firmware: ${H5000M_APK_REPO_URL}"

          ./scripts/local-build.sh "${args[@]}"

      # Both halves are required, and this is the part that is easy to get
      # wrong: OpenWrt's completion markers (.built, .prepared) live in
      # build_dir/toolchain-*/, NOT in staging_dir/.  Caching only the installed
      # toolchain would restore the binaries and still rebuild the whole thing,
      # because make looks at the stamps.
      #
      #   build_dir/toolchain-*      ~4.0 GB, the stamps and build trees
      #   staging_dir/host           ~0.3 GB, host tools and their .prepared
      #   staging_dir/toolchain-*    ~0.4 GB, the installed cross toolchain
      #
      # zstd -1 because this runs on every build and the cache action compresses
      # again anyway; the goal is a fast archive, not a small one.
      - name: Pack the toolchain for the cache
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .toolchain-cache
          # The globs must expand INSIDE openwrt/.  Expanding them from the
          # repository root matches nothing, and with nullglob set the patterns
          # then vanish silently — an earlier version of this step cached only
          # staging_dir/host, the one literal path in the list, and reported
          # success while caching almost nothing.
          (
            cd openwrt
            shopt -s nullglob
            # build_dir/host carries the host tools' .built stamps.  Without it
            # every run recompiles all ~55 host tools even though
            # staging_dir/host was restored — measured at 18 minutes, 10 of them
            # in cmake alone.  rust is excluded: its HOST_BUILD_DIR is
            # build_dir/host/rustc-<ver>-src, and a host build tree captured at
            # a different moment is the documented reason a restored cache once
            # broke `package/feeds/packages/rust [host]` 72 seconds into a
            # build.  The host tools themselves are cheap and safe to reuse.
            dirs=(build_dir/toolchain-* build_dir/host staging_dir/host staging_dir/toolchain-*)
            [ "${#dirs[@]}" -gt 0 ] || { echo "::warning::no toolchain to cache"; exit 0; }
            echo "caching: ${dirs[*]}"
            tar -I 'zstd -1' --exclude='build_dir/host/rustc*' \
              -cf ../.toolchain-cache/toolchain.tar.zst "${dirs[@]}"
          )
          echo "packed $(du -h .toolchain-cache/toolchain.tar.zst | cut -f1)"

      # Pack and push the build tree.  Split into two blobs so a failure to
      # upload one does not lose the other, and so the layers can be reused
      # independently by the registry.
      - name: Save build cache to GitHub Packages
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # Step outputs are attacker-influenced in principle (they derive from
          # the repository name and a hash), so they cross into the shell as
          # DATA via the environment, never as interpolated source text.  This
          # was the last `info`-level template-injection finding zizmor
          # reported; the workflow is now clean at every severity.
          CACHE_IMAGE: ${{ steps.buildcache.outputs.image }}
          CACHE_TAG: ${{ steps.buildcache.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .buildcache
          (
            cd openwrt
            shopt -s nullglob
            # NOT build_dir/host: rust's HOST_BUILD_DIR is
            # build_dir/host/rustc-<ver>-src, and restoring a host build tree
            # that was captured at a different moment is the most likely reason
            # `package/feeds/packages/rust [host]` began failing 72 seconds into
            # the build — far too fast for LLVM to have been compiling.  The
            # host tools are cheap next to that risk.
            dirs=(build_dir/target-* build_dir/hostpkg
                  staging_dir/target-* staging_dir/hostpkg)
            keep=()
            for d in "${dirs[@]}"; do [ -e "$d" ] && keep+=("$d"); done
            [ "${#keep[@]}" -gt 0 ] || { echo "::warning::nothing to cache"; exit 0; }
            echo "packing: ${keep[*]}"
            tar -I 'zstd -1' -cf ../.buildcache/build-cache.tar.zst "${keep[@]}"
          )
          size="$(du -h .buildcache/build-cache.tar.zst | cut -f1)"
          echo "packed ${size}"
          printf '%s' "${GH_TOKEN}" | oras login ghcr.io -u "${GH_ACTOR}" --password-stdin
          # Push from INSIDE .buildcache.  oras takes the blob's title from the
          # path it is given, so `oras push image .buildcache/x.tar.zst` stores
          # the title as ".buildcache/x.tar.zst" — and `oras pull -o .buildcache`
          # then writes it to .buildcache/.buildcache/x.tar.zst, where the build
          # does not look.  That is exactly what happened: 15 GB was pulled on
          # every run and never used, and the log said
          #   restored 15G from ...buildcache:cfde3dbe...
          #   No cached build state at .../.buildcache/build-cache.tar.zst
          # A bare file name makes the title a bare file name.
          # A sidecar checksum, pushed alongside.  Without it a truncated
          # transfer is only discovered after six minutes of tar failing with
          # "premature end", and the run silently rebuilds everything: 15 GB
          # moved for nothing and no indication of why.
          ( cd .buildcache && sha256sum build-cache.tar.zst > build-cache.sha256 )
          ( cd .buildcache && oras push "${CACHE_IMAGE}:${CACHE_TAG}" build-cache.tar.zst build-cache.sha256 )
          # Record the exact size and digest being stored.  A build cache that
          # comes back "truncated" every single time is otherwise impossible to
          # localise: these two lines say what was pushed, and the restore step
          # says what came back, so the next run can tell a bad push from a bad
          # pull instead of guessing.
          echo "pushed $(stat -c '%s' .buildcache/build-cache.tar.zst) bytes, sha256 $(cut -d' ' -f1 .buildcache/build-cache.sha256) as ${CACHE_IMAGE}:${CACHE_TAG} (${size})"
          # Confirm the push actually landed.  This step is continue-on-error, so
          # a half-finished upload is otherwise invisible — and it is not free:
          # the next run transfers the whole archive before rejecting it.
          if oras manifest fetch "${CACHE_IMAGE}:${CACHE_TAG}" >/dev/null 2>&1; then
            echo "the pushed cache manifest is readable"
          else
            echo "::warning::the build cache push could not be verified; the next run will rebuild from scratch"
          fi

      # This is the step that has to work, because everything else about a
      # failure is guesswork without it.
      #
      # Three separate mechanisms used to fail at once, which is why three
      # consecutive builds reported nothing but "ERROR: package/X failed to
      # build." — twice for the same package, with no way to see why:
      #
      #   * build.log held only the script's own log() lines.  The ERROR line is
      #     printed by make, so it never reached the file this step read, and
      #     the grep below found nothing while the line sat in the console.
      #     Fixed in compile_firmware, which now tees make's output into it.
      #   * The per-package logs OpenWrt can produce were switched off.  The
      #     seed set CONFIG_BUILD_LOG=y, but that symbol is `if DEVEL`, so
      #     defconfig dropped it silently.  local-build.sh now passes
      #     BUILD_LOG=1 BUILD_LOG_DIR directly to make.
      #   * The step then guessed a package — package/feeds/packages/rust/host,
      #     the first failure this project ever hit — and spent its budget
      #     re-proving rust while a different package was broken.
      #
      # So: read the real per-package logs first (error.txt names the failing
      # target, <target>/compile.txt holds its output), and only re-run a build
      # if those are missing.
      - name: Diagnose a failed build
        if: failure()
        continue-on-error: true
        timeout-minutes: 40
        env:
          BUILD_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && github.workspace || '/o' }}
        run: |
          set -uo pipefail
          cd "$BUILD_DIR"
          echo "=== last 120 lines of build.log (script log + make output) ==="
          tail -120 build.log 2>/dev/null || echo "(no build.log)"

          echo
          echo "=== OpenWrt per-package logs ==="
          if [ -d logs ]; then
            echo "logs/ contains $(find logs -type f | wc -l) file(s)"
            # error.txt is written by include/subdir.mk on every failure and
            # names the target that failed.  Its location is the subdir make was
            # building, not the package directory, so read the contents.
            mapfile -t errfiles < <(find logs -name error.txt 2>/dev/null)
            if [ "${#errfiles[@]}" -eq 0 ]; then
              echo "(no error.txt; listing the largest logs instead)"
              find logs -type f -name '*.txt' -size +1k -printf '%s %p\n' 2>/dev/null \
                | sort -rn | head -10
            fi
            for f in ${errfiles[@]+"${errfiles[@]}"}; do
              echo
              echo "--- $f"
              cat "$f"
            done
          else
            echo "(no logs/ directory)"
          fi

          # Name the failing package from every available source.
          mapfile -t failed < <(
            {
              grep -aoE 'ERROR: [^ ]+ failed to build' build.log 2>/dev/null
              find logs -name error.txt -exec cat {} + 2>/dev/null
            } | grep -aoE 'ERROR: [^ ]+ failed to build' \
              | sed 's/^ERROR: *//; s/ failed to build$//' | sort -u
          )
          if [ "${#failed[@]}" -eq 0 ]; then
            # Last resort: the package make started most recently is almost
            # always the one that failed, because the ERROR line follows it.
            last=$(grep -aoE 'make\[[0-9]+\] -C [^ ]+ compile' build.log 2>/dev/null \
              | tail -1 | awk '{print $3}')
            if [ -n "$last" ]; then
              failed=("$last")
              echo
              echo "no ERROR line found; falling back to the last package make started: $last"
            fi
          fi
          printf 'failing package(s): %s\n' "${failed[*]:-<none identified>}"

          # Everything needed to explain the failure is normally already on
          # disk.  Only re-run when it is not.
          for pkg in ${failed[@]+"${failed[@]}"}; do
            shown=0
            for log in "logs/${pkg}/compile.txt" "logs/${pkg}/host-compile.txt"; do
              if [ -s "$log" ]; then
                echo
                echo "=== $log (last 150 lines) ==="
                tail -150 "$log"
                shown=1
              fi
            done
            if [ "$shown" = 1 ]; then
              continue
            fi

            echo
            echo "=== no per-package log for ${pkg}; re-running it with V=s ==="
            echo "--- ${pkg}/download ---"
            timeout 900 make -C openwrt -j1 "${pkg}/download" V=s > /tmp/diag-dl.log 2>&1
            echo "exit: $?"
            tail -40 /tmp/diag-dl.log

            echo
            echo "--- ${pkg}/compile ---"
            timeout 1800 make -C openwrt -j1 "${pkg}/compile" V=s > /tmp/diag-cc.log 2>&1
            echo "exit: $?"
            echo "--- error lines (whole output, not just the tail) ---"
            grep -aiE 'error|Error [0-9]|undefined reference|No such file|mismatch' /tmp/diag-cc.log \
              | tail -60 || true
            echo "--- last 120 lines ---"
            tail -120 /tmp/diag-cc.log
          done

      # A hard gate, before anything is uploaded or published.
      #
      # The fullcone chain is four layers deep, and three of the four ways it can
      # break are silent: a patch that `patch --dry-run` accepts but that never
      # creates a file; a source file that is never added to the build; an option
      # that firewall4's whitelist discards.  All three of those actually happened
      # during development, and each of them produced a firmware that looked
      # healthy.  A build that compiles is not evidence that the feature works.
      #
      # These assertions read the *built* tree rather than the source tree, so they
      # check what the image actually carries, and they need no device.
      #
      # The libnftnl assertion is the one with real teeth: with the broken patch
      # the library still links and the build still succeeds, leaving
      # expr_ops_fullcone undefined until something calls nftnl_expr_alloc().
      # Verified to fail on a library in that state and pass on a fixed one.
      - name: Verify the fullcone chain is really in the image
        env:
          BUILD_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && github.workspace || '/o' }}
        run: |
          set -uo pipefail
          cd "$BUILD_DIR"
          fail=0
          check() { if bash -c "$2" >/dev/null 2>&1; then echo "  OK    $1"; else echo "  FAIL  $1"; fail=$((fail+1)); fi; }

          echo "=== layer 1: kernel module ==="
          check "nft_fullcone.ko was built" \
            'find openwrt/build_dir/target-*/linux-*/nft-fullcone -name nft_fullcone.ko | grep -q .'
          check "the module registers the fullcone expression" \
            'strings $(find openwrt/build_dir/target-*/linux-*/nft-fullcone -name nft_fullcone.ko | head -1) | grep -qx fullcone'
          # The previous version of this check accepted any
          # bin/.../kmod-nft-fullcone*.apk, and a real device exposed what that
          # misses: CONFIG_NFT_FULLCONE is not a symbol the kernel's own Kconfig
          # knows, `make syncconfig` stripped it from $(LINUX_DIR)/.config, and
          # include/kernel.mk then generated a 1066-byte package with the right
          # metadata and NO nft_fullcone.ko.  Everything else — the userspace
          # layers, the =y symbol — looked correct.  The .pkgdir / rootfs
          # assertions are the ones that prove the module can actually load.
          check "kmod-nft-fullcone carries nft_fullcone.ko (package not empty)" \
            'find openwrt/build_dir/target-*/linux-*/nft-fullcone/.pkgdir/kmod-nft-fullcone -name nft_fullcone.ko | grep -q .'
          check "kmod-nft-fullcone in the assembled rootfs" \
            'find openwrt/build_dir/target-*/root-* -name nft_fullcone.ko | grep -q . ||
             find openwrt/staging_dir/target-*/root-* -name nft_fullcone.ko | grep -q .'

          echo; echo "=== layer 2+3: libnftnl and nftables userspace ==="
          # This is the assertion that the broken patch fails: without src/expr/fullcone.c
          # wired into the build, libnftnl still links but leaves expr_ops_fullcone
          # undefined, which is invisible until something calls nftnl_expr_alloc().
          check "libnftnl resolves expr_ops_fullcone (no dangling symbol)" \
            'L=$(ls openwrt/build_dir/target-*/libnftnl-*/src/.libs/libnftnl.so.* 2>/dev/null | head -1);
             [ -n "$L" ] && ! nm -D --undefined-only "$L" | grep -q expr_ops_fullcone'
          check "libnftnl carries the fullcone expression object" \
            'strings $(ls openwrt/build_dir/target-*/libnftnl-*/src/.libs/libnftnl.so.* 2>/dev/null | head -1) | grep -q expr_ops_fullcone'
          check "the nftables scanner knows the fullcone keyword" \
            'grep -rqs --include=scanner.l fullcone openwrt/build_dir/target-*/nftables-*/'
          check "the generated bison parser has the fullcone statement" \
            'grep -rqs --include=parser_bison.c fullcone openwrt/build_dir/target-*/nftables-*/'
          check "libnftables.so carries the fullcone expression name" \
            'grep -rqas fullcone openwrt/build_dir/target-*/nftables-*/*/src/.libs/libnftables.so.*'

          echo; echo "=== layer 4: firewall4 ==="
          check "firewall4 accepts fullcone in its parse_defaults whitelist" \
            'grep -rqs --include=fw4.uc "fullcone: \[ \"bool\", \"0\" \]" openwrt/build_dir/target-*/firewall4-*/'
          check "zone-masq.uc emits fullcone instead of masquerade" \
            'grep -rqs --include=zone-masq.uc fullcone openwrt/build_dir/target-*/firewall4-*/'
          check "ruleset.uc adds the prerouting fullcone rules" \
            'grep -rqs --include=ruleset.uc "fullcone comment" openwrt/build_dir/target-*/firewall4-*/'
          check "the acceleration page depends on all four layers" \
            'grep -q kmod-nft-fullcone openwrt/package/luci-app-h5000m-accel/Makefile &&
             grep -q firewall4 openwrt/package/luci-app-h5000m-accel/Makefile'

          echo; echo "=== config ==="
          check "firewall4 =y" 'grep -q "^CONFIG_PACKAGE_firewall4=y$" openwrt/.config'
          check "nftables-json =y" 'grep -q "^CONFIG_PACKAGE_nftables-json=y$" openwrt/.config'
          check "kmod-nft-fullcone =y" 'grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y$" openwrt/.config'

          echo; if [ "$fail" -ne 0 ]; then echo "结论：$fail 项未通过"; exit 1; fi; echo "结论：全部通过"

      # The same class of regression as the fullcone gate, reported from a real
      # device: `apk add luci-app-homeproxy` failed with
      #
      #   To enable Tun support, you need to install ip-full and kmod-tun.
      #
      # A kernel module can only come from a repository built against THIS
      # kernel, and the only other source the image carries is
      # downloads.openwrt.org/snapshots, whose kmods have a different vermagic
      # and whose files disappear as soon as the snapshot moves.  So a kmod that
      # is merely `=m` in our repository is not actually installable, and the
      # dependency has to be in the image.
      #
      # This asserts both halves: the symbols are `=y` (so the image carries
      # them), and luci-app-ssr-plus gained the core dependency that makes a
      # plain install produce a working router.
      - name: Verify the proxy stack dependencies are in the image
        env:
          BUILD_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && github.workspace || '/o' }}
          # The same expression the Build step uses, so a run that turned the
          # eBPF kernel options off is not failed by a check that insists they
          # are on.  Nothing else here differs by switch.
          ENABLE_EBPF_PROXY_KERNEL: ${{ vars.ENABLE_EBPF_PROXY_KERNEL || 'true' }}
        run: |
          set -uo pipefail
          cd "$BUILD_DIR"
          fail=0
          check() { if bash -c "$2" >/dev/null 2>&1; then echo "  OK    $1"; else echo "  FAIL  $1"; fail=$((fail+1)); fi; }

          echo "=== kernel modules a frontend needs, in the image (=y) ==="
          for sym in kmod-tun kmod-inet-diag kmod-dummy \
                     kmod-nft-queue kmod-nfnetlink-queue kmod-nft-tproxy \
                     kmod-nft-socket \
                     kmod-ipt-tproxy kmod-ipt-conntrack-extra \
                     kmod-netlink-diag kmod-nf-nathelper kmod-macvlan \
                     kmod-sched-core kmod-ifb kmod-sched-bpf kmod-ipt-filter \
                     kmod-ipt-ipset kmod-veth; do
            check "${sym} =y" "grep -q '^CONFIG_PACKAGE_${sym}=y$' openwrt/.config"
          done

          echo
          echo "=== userspace dependencies HomeProxy checks for ==="
          for sym in ip-full ucode-mod-math sing-box; do
            check "${sym} =y" "grep -q '^CONFIG_PACKAGE_${sym}=y$' openwrt/.config"
          done

          echo
          echo "=== adblock DNS backends in the image ==="
          # adblock-fast offers dnsmasq.ipset / dnsmasq.nftset, and the LuCI page
          # hides a mode whose prerequisites are absent.  dnsmasq-full carries
          # both features; ipset is the userspace tool the ipset check probes.
          # kmod-ipt-ipset is covered by the kernel-module loop above.
          for sym in dnsmasq-full ipset; do
            check "${sym} =y" "grep -q '^CONFIG_PACKAGE_${sym}=y$' openwrt/.config"
          done

          echo
          echo "=== eBPF proxy kernel support (Nikki-RS) ==="
          # Nikki-RS's eBPF fast path has two halves.  The TC half rides on
          # kmod-sched-core (clsact / NET_SCH_INGRESS + NET_CLS_ACT) and
          # kmod-sched-bpf (cls_bpf + act_bpf); those are already =y above, and
          # the kernel symbols are asserted here because a package being present
          # does not prove its KCONFIG landed.  The host/process half is a
          # cgroup BPF hook, and that is the part mainline leaves off — hence the
          # two CONFIG_KERNEL_* symbols the switch writes.
          if [ "${ENABLE_EBPF_PROXY_KERNEL:-true}" = "true" ]; then
            check "CONFIG_KERNEL_CGROUPS=y" \
              "grep -q '^CONFIG_KERNEL_CGROUPS=y$' openwrt/.config"
            check "CONFIG_KERNEL_CGROUP_BPF=y" \
              "grep -q '^CONFIG_KERNEL_CGROUP_BPF=y$' openwrt/.config"
            # BTF.  KERNEL_DEBUG_INFO_BTF is
            # `depends on KERNEL_DEBUG_INFO && !KERNEL_DEBUG_INFO_REDUCED`, and
            # DEBUG_INFO_REDUCED defaults to y — so all three symbols are
            # asserted, not just BTF itself, since re-enabling REDUCED is enough
            # to drop BTF with no other symptom.
            check "CONFIG_KERNEL_DEBUG_INFO=y" \
              "grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' openwrt/.config"
            check "CONFIG_KERNEL_DEBUG_INFO_REDUCED=n" \
              "grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=n$' openwrt/.config"
            check "CONFIG_KERNEL_DEBUG_INFO_BTF=y" \
              "grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' openwrt/.config"
            # The kernel .config is $(LINUX_DIR)/.config, i.e.
            # build_dir/target-*/linux-<board>_<subtarget>/linux-<ver>/.config
            # (include/kernel.mk: KERNEL_BUILD_DIR = $(BUILD_DIR)/linux-$(BOARD)_$(SUBTARGET),
            #  LINUX_DIR = $(KERNEL_BUILD_DIR)/linux-$(LINUX_VERSION)).
            # Two linux-* levels, not one: a single-level glob silently matches
            # nothing and every check below would "fail" on a correct build.
            KCFG='openwrt/build_dir/target-*/linux-*/linux-*/.config'
            check "kernel CONFIG_CGROUPS=y" \
              "grep -q '^CONFIG_CGROUPS=y\$' $KCFG"
            check "kernel CONFIG_CGROUP_BPF=y" \
              "grep -q '^CONFIG_CGROUP_BPF=y\$' $KCFG"
            check "kernel CONFIG_NET_CLS_ACT=y" \
              "grep -q '^CONFIG_NET_CLS_ACT=y\$' $KCFG"
            check "kernel CONFIG_NET_CLS_BPF built" \
              "grep -qE '^CONFIG_NET_CLS_BPF=[my]\$' $KCFG"
            check "kernel CONFIG_NET_ACT_BPF built" \
              "grep -qE '^CONFIG_NET_ACT_BPF=[my]\$' $KCFG"
            check "kernel CONFIG_NET_SCH_INGRESS built" \
              "grep -qE '^CONFIG_NET_SCH_INGRESS=[my]\$' $KCFG"
            # The real kernel .config is the last word: KCONFIG_ALLCONFIG and
            # syncconfig both run after our symbols are written, so this is where
            # a dropped BTF would actually show up.
            check "kernel CONFIG_DEBUG_INFO=y" \
              "grep -q '^CONFIG_DEBUG_INFO=y\$' $KCFG"
            check "kernel CONFIG_DEBUG_INFO_BTF=y" \
              "grep -q '^CONFIG_DEBUG_INFO_BTF=y\$' $KCFG"
            check "kernel CONFIG_DEBUG_INFO_REDUCED is not set" \
              "grep -qE '^# CONFIG_DEBUG_INFO_REDUCED is not set\$|^CONFIG_DEBUG_INFO_REDUCED=n\$' $KCFG"
          else
            echo "  (skipped: ENABLE_EBPF_PROXY_KERNEL is off)"
          fi

          echo
          echo "=== the kmods really are in the built rootfs ==="
          # Three ways to prove the same thing, because the rootfs directory is
          # assembled by the image build and its exact layout (root-mediatek vs
          # root-hiveton_h5000m) has moved between releases: the module in the
          # assembled rootfs, the package recorded in that rootfs' installed
          # database, or the .apk itself.  The fullcone gate above uses the same
          # chain for the same reason.
          echo "  rootfs dirs: $(ls -d openwrt/build_dir/target-*/root-* 2>/dev/null | tr '\n' ' ')"
          echo "  modules in them: $(find openwrt/build_dir/target-*/root-* -name '*.ko' 2>/dev/null | wc -l)"
          check "kmod-tun (tun.ko)" \
            'find openwrt/build_dir/target-*/root-* -name tun.ko | grep -q . ||
             grep -rqs kmod-tun openwrt/build_dir/target-*/root-*/usr/lib/apk/db/installed ||
             find openwrt/bin -name "kmod-tun-*.apk" | grep -q .'
          check "kmod-dummy (dummy.ko)" \
            'find openwrt/build_dir/target-*/root-* -name dummy.ko | grep -q . ||
             grep -rqs kmod-dummy openwrt/build_dir/target-*/root-*/usr/lib/apk/db/installed ||
             find openwrt/bin -name "kmod-dummy-*.apk" | grep -q .'
          check "kmod-inet-diag (inet_diag.ko)" \
            'find openwrt/build_dir/target-*/root-* -name inet_diag.ko | grep -q . ||
             grep -rqs kmod-inet-diag openwrt/build_dir/target-*/root-*/usr/lib/apk/db/installed ||
             find openwrt/bin -name "kmod-inet-diag-*.apk" | grep -q .'
          check "sing-box binary" \
            'find openwrt/build_dir/target-*/root-* -name "sing-box" -type f | grep -q . ||
             grep -rqs sing-box openwrt/build_dir/target-*/root-*/usr/lib/apk/db/installed ||
             find openwrt/bin -name "sing-box-*.apk" | grep -q .'

          echo
          echo "=== every front-end declares a core ==="
          # These apps reach their cores through `select` switches, and a select
          # inside a package that is itself only =m does not become an install
          # dependency — so the app installs with a panel that cannot start a
          # node.  scripts/local-build.sh adds the dependency; this asserts it.
          for entry in \
            "luci-app-ssr-plus/luci-app-ssr-plus|+xray-core|+mihomo" \
            "openwrt-passwall/luci-app-passwall|+xray-core|+sing-box" \
            "openwrt-passwall2/luci-app-passwall2|+xray-core|+sing-box"; do
            mk="openwrt/package/${entry%%|*}/Makefile"
            rest="${entry#*|}"
            first="${rest%%|*}"
            second="${rest#*|}"
            if grep -q "^LUCI_DEPENDS+=.*${first}\b" "$mk" 2>/dev/null &&
               grep -q "^LUCI_DEPENDS+=.*${second}\b" "$mk" 2>/dev/null; then
              echo "  OK    ${entry%%|*} declares ${first} ${second}"
            else
              echo "  FAIL  ${entry%%|*} does not declare ${first} ${second}"
              fail=$((fail + 1))
            fi
          done

          echo
          if [ "$fail" -ne 0 ]; then
            echo "The proxy stack's dependencies are not all in the image; refusing to publish this firmware."
            exit 1
          fi
          echo "Every proxy-stack dependency checked is present in the image."

      # The promise the README makes is "install it from the repository", and a
      # `.config` check cannot see whether that promise holds.  A real device ran
      #
      #   apk add luci-app-ssr-plus
      #   Main node:Xray 和 Mihomo 内核均不存在，无法启动。
      #
      # because the package declared no core at all, and separately installed
      # sing-box 1.14.0 from the official snapshot, which ignores the pin the
      # front-ends depend on.  This step reads the index that will be published,
      # with ONLY this project's repository configured — so anything the solver
      # resolves here is resolved on the device without the official snapshot
      # being involved, and anything that resolves to the wrong version shows up
      # as a wrong version.
      #
      # Two measured apk behaviours shape the code below: `apk list <missing>`
      # exits 0 with no output, and `apk query --recursive` exits 0 with its
      # failure on stderr.  Neither the exit status nor stdout alone is enough.
      - name: Verify the built repository can satisfy every frontend on its own
        env:
          BUILD_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_type == 'self-hosted') && github.workspace || '/o' }}
        run: |
          set -uo pipefail
          cd "$BUILD_DIR"
          APK=openwrt/staging_dir/host/bin/apk
          INDEX=artifacts/apk-repo/packages.adb
          ARCH=aarch64_cortex-a53
          fail=0
          ok()  { echo "  OK    $1"; }
          bad() { echo "  FAIL  $1"; fail=$((fail + 1)); }

          [ -x "$APK" ] || { echo "::error::no apk tool at $APK to read the index with"; exit 1; }
          [ -s "$INDEX" ] || { echo "::error::$INDEX is missing or empty"; exit 1; }

          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/cache"
          if ! "$APK" --root "$ROOT" --arch "$ARCH" --allow-untrusted --initdb --usermode add >/dev/null 2>&1; then
            echo "::error::could not create a scratch apk database"
            exit 1
          fi
          # Absolute, and derived from BUILD_DIR rather than a hardcoded /o:
          # on a self-hosted runner the build ran in the real workspace, and an
          # index path pointing at the non-existent /o would make this gate fail
          # with "this apk cannot read ..." on a perfectly good repository.
          printf '%s\n' "${BUILD_DIR}/${INDEX}" > "$ROOT/etc/apk/repositories"
          apk_() { "$APK" --root "$ROOT" --arch "$ARCH" --allow-untrusted --cache-dir "$ROOT/cache" "$@"; }
          if ! apk_ update >/dev/null 2>&1; then
            echo "::error::this tree's own apk cannot read ${INDEX} — devices would not either"
            exit 1
          fi

          echo "=== what the published index contains ==="
          echo "  $(apk_ list 2>/dev/null | wc -l) packages, no official feeds configured"
          echo
          echo "=== front-ends a user may install ==="
          for p in luci-app-passwall luci-app-passwall2 luci-app-ssr-plus luci-app-homeproxy \
                   luci-app-nikki-rs luci-app-momo luci-app-openclash luci-app-mosdns \
                   luci-app-nekobox luci-app-xray luci-app-hijpass luci-app-fchomo \
                   luci-app-v2raya luci-app-adblock luci-app-adblock-fast; do
            if [ -n "$(apk_ list "$p" 2>/dev/null)" ]; then ok "$p"; else bad "$p is not in the built repository"; fi
          done
          echo
          echo "=== Chinese translations (upstream ships them separately) ==="
          # The promise to the user is "本体 + 核 + 中文翻译".  A renamed or
          # dropped translation package is otherwise invisible: everything
          # else installs cleanly and the UI merely comes up in English.
          # Kept in step with TRANSLATIONS in scripts/verify-apk-repo.sh.
          for p in luci-i18n-passwall-zh-cn luci-i18n-passwall2-zh-cn \
                   luci-i18n-ssr-plus-zh-cn luci-i18n-homeproxy-zh-cn \
                   luci-i18n-nikki-rs-zh-cn luci-i18n-momo-zh-cn \
                   luci-i18n-mosdns-zh-cn luci-i18n-hijpass-zh-cn \
                   luci-i18n-fchomo-zh-cn luci-i18n-v2raya-zh-cn \
                   luci-i18n-adblock-zh-cn luci-i18n-adblock-fast-zh-cn; do
            if [ -n "$(apk_ list "$p" 2>/dev/null)" ]; then ok "$p"; else bad "$p is not in the built repository"; fi
          done
          echo
          echo "=== cores and daemons, without which a front-end cannot run ==="
          for p in xray-core mihomo sing-box mosdns nikki-rs clash-rs momo adblock adblock-fast dns2tcp ip-full ucode-mod-math; do
            if [ -n "$(apk_ list "$p" 2>/dev/null)" ]; then ok "$p"; else bad "$p is not in the built repository"; fi
          done
          echo
          echo "=== adblock-fast's recommended tools ==="
          # adblock-fast probes `gawk` by name and the absolute paths
          # /usr/libexec/{grep-gnu,sed-gnu,sort-coreutils}, and warns — with an
          # `apk add` line — when they are absent, even though busybox provides
          # awk/grep/sed/sort.  The warning is only actionable if this repository
          # actually carries the four packages.
          for p in gawk grep sed coreutils-sort; do
            if [ -n "$(apk_ list "$p" 2>/dev/null)" ]; then ok "$p"; else bad "$p is not in the built repository"; fi
          done
          echo

          # Carrying the four is not the claim that clears the warning — the PATHS
          # are, and only an install can show them.  A repository that carries the
          # packages but installs them anywhere else leaves the warning up on the
          # device that followed the advice, which is invisible to a presence
          # check.  Mirrors scripts/verify-apk-repo.sh; keep the two in step.
          #
          # A separate database, because $ROOT above is what the version-pin
          # reasoning depends on.  --scripts=no because the post-install scripts
          # are aarch64 binaries and this runner is x86_64: apk would report each
          # one as "exited with error 127", which says nothing about the repository
          # under test.
          echo "=== and they install where adblock-fast looks ==="
          TOOLS_ROOT="$(mktemp -d)"
          mkdir -p "$TOOLS_ROOT/cache"
          if ! "$APK" --root "$TOOLS_ROOT" --arch "$ARCH" --allow-untrusted --initdb --usermode add >/dev/null 2>&1; then
            bad "could not create a scratch apk database for the install check"
          else
            printf '%s\n' "${BUILD_DIR}/${INDEX}" >"$TOOLS_ROOT/etc/apk/repositories"
            if ! "$APK" --root "$TOOLS_ROOT" --arch "$ARCH" --allow-untrusted \
                 --cache-dir "$TOOLS_ROOT/cache" --scripts=no \
                 add gawk grep sed coreutils-sort >/dev/null 2>&1; then
              bad "apk add gawk grep sed coreutils-sort failed against the built repository"
            else
              for spec in "gawk:usr/bin/gawk usr/sbin/gawk" \
                          "grep:usr/libexec/grep-gnu" \
                          "sed:usr/libexec/sed-gnu" \
                          "coreutils-sort:usr/libexec/sort-coreutils"; do
                pkg="${spec%%:*}"
                paths="${spec#*:}"
                hit=""
                for path in $paths; do
                  if [ -e "${TOOLS_ROOT}/${path}" ]; then hit="$path"; break; fi
                done
                if [ -n "$hit" ]; then
                  ok "$pkg installs ${hit}, which is where adblock-fast looks"
                else
                  bad "$pkg installs nothing at ${paths} — the panel would keep warning after following its own advice"
                fi
              done
            fi
          fi
          rm -rf "$TOOLS_ROOT"
          echo
          echo "=== kernel modules (they must carry this kernel's vermagic) ==="
          for p in kmod-tun kmod-inet-diag kmod-dummy kmod-nft-queue kmod-nfnetlink-queue \
                   kmod-nft-tproxy kmod-nft-socket kmod-nft-fullcone kmod-ipt-tproxy \
                   kmod-ipt-conntrack-extra kmod-ipt-filter kmod-netlink-diag \
                   kmod-nf-nathelper kmod-macvlan kmod-sched-core kmod-sched-bpf \
                   kmod-ifb kmod-tcp-bbr kmod-ipt-ipset kmod-veth; do
            if [ -n "$(apk_ list "$p" 2>/dev/null)" ]; then ok "$p"; else bad "$p is not in the built repository"; fi
          done
          echo
          echo "=== the version pins that cannot be left to the snapshot ==="
          # The official snapshot carries a newer sing-box, and apk resolves to
          # the highest version across every configured repository.  A pin only
          # holds if the pinned version is the one that gets installed; the
          # device proved it does not hold on its own.
          pinned="$(apk_ list sing-box 2>/dev/null | awk '{print $1}')"
          case "$pinned" in
            sing-box-1.12.25-r1) ok "sing-box is pinned to 1.12.25 ($pinned)" ;;
            "")                  bad "sing-box is not in the built repository" ;;
            *)                   bad "sing-box is $pinned, not 1.12.25 — the front-ends emit removed inbound fields" ;;
          esac
          echo
          echo "=== dependency resolution, exactly as the device does it ==="
          # Empty stderr is the pass condition: the failure path prints
          # "ERROR: unable to select packages" there and still exits 0.
          resolve() {
            local err out
            err="$(apk_ query --recursive "$1" 2>&1 >/dev/null)"
            out="$(apk_ query --recursive "$1" 2>/dev/null)"
            if [ -z "$err" ] && [ -n "$out" ]; then
              ok "$1 resolves entirely from this repository"
            else
              bad "$1 does not resolve: $(printf '%s' "$err" | head -3 | tr '\n' ' ')"
            fi
          }
          resolve luci-app-ssr-plus
          resolve luci-app-homeproxy
          resolve luci-app-passwall
          resolve luci-app-passwall2
          resolve luci-app-nikki-rs
          resolve luci-app-momo
          resolve luci-app-openclash
          resolve luci-app-mosdns
          resolve luci-app-nekobox
          resolve luci-app-adblock-fast
          echo
          echo "=== and each one actually pulls a core ==="
          # Resolving is not enough: luci-app-ssr-plus resolved fine on the
          # device while declaring no core at all, which is exactly what the user
          # saw as "Main node:Xray 和 Mihomo 内核均不存在".  The core has to be in
          # the resolution, not merely in the repository.
          require_core() {
            local pkg="$1" core="$2" err out
            err="$(apk_ query --recursive "$pkg" 2>&1 >/dev/null)"
            out="$(apk_ query --recursive "$pkg" 2>/dev/null)"
            if [ -z "$err" ] && printf '%s\n' "$out" | grep -q "^Name: ${core}$"; then
              ok "$pkg pulls $core"
            else
              bad "$pkg does not pull $core"
            fi
          }
          require_core luci-app-ssr-plus   xray-core
          require_core luci-app-ssr-plus   mihomo
          require_core luci-app-passwall   xray-core
          require_core luci-app-passwall   sing-box
          require_core luci-app-passwall2  xray-core
          require_core luci-app-passwall2  sing-box
          require_core luci-app-homeproxy  sing-box
          require_core luci-app-nikki-rs   nikki-rs
          require_core luci-app-nikki-rs   clash-rs
          require_core luci-app-momo       momo
          require_core luci-app-adblock-fast adblock-fast
          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail repository check(s) failed — the published repository would not be installable"
            exit 1
          fi
          echo "The published repository satisfies every front-end on its own."

      # A loud build hides real problems.  The previous run printed 1722
      # arithmetic errors and 68 Makefile warnings; the 1722 are fixed (they
      # were normalize_source_mtimes using a bash-only `16#` under dash), and
      # the rest are upstream feed metadata that we neither build nor select.
      # This step separates the two so that a warning about something WE build
      # fails the run instead of drowning in feed noise.
      - name: Audit build warnings
        working-directory: /o
        run: |
          set -uo pipefail
          LOG=build.log
          [ -f "$LOG" ] || { echo "::warning::no build.log to audit"; exit 0; }

          strip() { sed 's/\x1b\[[0-9;]*m//g' "$LOG"; }

          # Anything our own script printed as a warning.  These are intentional
          # (mutually-exclusive switches, a missing optional tool) and the count
          # is reported rather than failed on.
          own="$(strip | grep -ac 'h5000m:warn' || true)"

          # Arithmetic errors: this class is what made the log unreadable, and it
          # means the mtime normalisation silently did nothing.
          arith="$(strip | grep -ac 'arithmetic expression: expecting EOF' || true)"
          if [ "$arith" != 0 ]; then
            echo "::error::${arith} arithmetic errors in the build — normalize_source_mtimes is broken again (it must not use bash-only arithmetic under sh)"
          fi

          # Makefile metadata warnings, split three ways:
          #   * feeds/*            upstream feed metadata, not our business
          #   * baseline in-tree   OpenWrt's own packages warning about OPTIONAL
          #                        deps that are simply not selected (busybox ->
          #                        libpam, lldpd -> libnetsnmp, ...).  Normal,
          #                        and not a defect; counted, not failed.
          #   * this project       the trees we clone in and patch (ssr-plus,
          #                        pas*wall, h5000m-*, nft-fullcone).  A
          #                        dangling dependency here IS ours to fix.
          strip | grep -aoE "WARNING: Makefile '[^']+'" \
            | sed "s|^.*WARNING: Makefile '||; s|'$||" | sort -u > /tmp/warned.txt || true
          upstream=0; baseline=0; ours=0
          while IFS= read -r mk; do
            [ -n "$mk" ] || continue
            case "$mk" in
              package/feeds/*) upstream=$((upstream + 1)) ;;
              package/luci-app-ssr-plus/*|package/openwrt-passwall*/*|package/luci-app-h5000m-*/*|package/h5000m-*/*|package/nft-fullcone/*|package/luci-theme-argon/*|package/luci-app-argon-config/*|package/openwrt-nekobox/*|package/OpenWrt-*/*|package/OpenClash/*|package/homeproxy/*|package/openwrt-fchomo/*|package/luci-app-mosdns/*|package/luci-ssr-plus-3proxy/*|package/luci-easymesh/*)
                ours=$((ours + 1))
                echo "::error::${mk} has an unsatisfiable dependency — fix it here (see prune_dangling_depends in scripts/local-build.sh)"
                ;;
              *) baseline=$((baseline + 1)) ;;
            esac
          done < /tmp/warned.txt

          echo "warning audit: ${own} script warning(s), ${arith} arithmetic error(s), ${ours} of this project's Makefiles, ${baseline} baseline OpenWrt (optional deps), ${upstream} upstream feed Makefiles"
          echo "upstream/baseline warnings are informational:"
          sed 's/^/  /' /tmp/warned.txt | head -20

          if [ "$arith" != 0 ] || [ "$ours" != 0 ]; then
            exit 1
          fi
          echo "No warnings about packages this project builds."

      - name: Collect build info
        if: always()
        run: |
          echo "=== BUILD-INFO.txt ==="
          cat artifacts/BUILD-INFO.txt 2>/dev/null || echo "(not produced)"
          echo
          echo "=== images ==="
          ls -la artifacts/ 2>/dev/null || true

      # A failed build's evidence is worth keeping.
      #
      # The successful-path upload below is skipped on failure, so without this
      # the reason for a failed build disappeared with the runner — which is how
      # the same package came to fail three times with nothing but "failed to
      # build" to show for it.  logs/ holds each package's full build output and
      # the name of the target that failed.
      - name: Upload build logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs
          path: |
            logs/
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: H5000M-mainline-openwrt
          path: |
            artifacts/
            build.log
          if-no-files-found: error
          retention-days: 14

      # Attest what we are about to publish.  A device that installs from this
      # repository trusts the index; provenance lets anyone verify WHICH run and
      # WHICH commit produced it, and the SBOM records what went into it.  OIDC
      # means no long-lived signing secret is involved.
      - name: Attest the firmware and the apk repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*squashfs-sysupgrade.bin
            artifacts/apk-repo/packages.adb

      - name: Upload apk repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-repo
          path: artifacts/apk-repo/
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        # Publish by default, for every way this workflow starts.
        #
        # The previous condition was `github.event_name == 'push' || (dispatch &&
        # publish_release)`, but `push` only fires for tags here — so the weekly
        # scheduled build produced a firmware and published nothing, which is
        # the case that most needs an artifact nobody has to fetch by hand.
        # Now only an explicit dispatch with the switch off declines.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit repository rather than git-remote discovery: this step runs
          # from `artifacts/`, and `gh` would otherwise have to walk up to find
          # `.git`.  Naming the repository removes that dependency — the same
          # latent failure that broke release-please.yml's dispatch step.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            rel_name="${GITHUB_REF_NAME}"
          else
            rev="$(sed -n 's/^openwrt_revision=//p' BUILD-INFO.txt)"
            rel_name="openwrt-${rev}"
          fi

          # Every firmware image this build produces, not just the sysupgrade
          # one: the initramfs is the recovery image, and the rootfs tarball is
          # what a chroot or container needs.  A release that carries only one of
          # them means fetching the Actions artifact — which expires — for the
          # others.
          #
          # U-Boot's failsafe web UI gates the initramfs upload on the file NAME
          # (it looks for *.itb), so ship the same FIT under both names — the
          # copy is byte-identical, only the extension differs.
          for f in *initramfs-kernel.bin; do
            [ -e "$f" ] && cp -f -- "$f" "${f/-initramfs-kernel.bin/-initramfs.itb}"
          done

          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find . -maxdepth 1 -type f \( \
                  -name '*squashfs-sysupgrade.bin' \
                  -o -name '*initramfs-kernel.bin' \
                  -o -name '*initramfs.itb' \
                  -o -name '*targz-rootfs.tar.gz' \
                  -o -name 'BUILD-INFO.txt' \
                  -o -name 'profiles.json' \
                  -o -name '*.manifest' \) -print0)

          rev="$(sed -n 's/^openwrt_revision=//p' BUILD-INFO.txt)"
          kver="$(sed -n 's/^kernel_version=//p' BUILD-INFO.txt)"
          abi="$(sed -n 's/^kernel_abi=//p' BUILD-INFO.txt)"
          nfiles="$(printf '%s\n' "${files[@]}" | wc -l)"

          notes="主线 OpenWrt（openwrt/openwrt main）Hiveton H5000M 固件。

          上游版本：${rev}
          内核版本：${kver}
          内核 ABI：${abi}
          构建日期：$(date -u +%Y-%m-%d)

          已包含 HigoOS 海狗前端（higorosd + Vue 面板，80 端口）与风扇温控、
          QModem 5G 拨号栈（Quectel RG520N-CN）、OpenAppFilter 应用过滤。
          LAN 与出厂一致：http://192.168.88.1 ；传统 LuCI 在 8080。

          刷机请用 *squashfs-sysupgrade.bin；*initramfs.itb（与
          *initramfs-kernel.bin 同一份 FIT）是 U-Boot failsafe 页面上传用的
          内存镜像；*targz-rootfs.tar.gz 供容器或 chroot 使用。
          内核 ABI 见 BUILD-INFO.txt，安装内核模块时必须与固件一致。

          一句话进 failsafe：to-failsafe（= fw_setenv failsafe 1 && reboot），
          之后电脑接 LAN、DHCP 打开 http://192.168.9.1 或 http://failsafe.lan。

          软件包仓库：https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          echo "publishing ${nfiles} files as ${rel_name}"
          printf '  %s\n' "${files[@]}"

          if gh release view "${rel_name}" >/dev/null 2>&1; then
            gh release upload "${rel_name}" "${files[@]}" --clobber
          else
            gh release create "${rel_name}" "${files[@]}" \
              --title "H5000M mainline OpenWrt ${rel_name}" \
              --notes "${notes}"
          fi

  # Publishes artifacts/apk-repo/ to GitHub Pages, which is what makes the
  # firmware's built-in source entry reachable.  The URL is derived from the
  # repository at build time (see H5000M_APK_REPO_URL above), so this job is
  # what turns that URL from a promise into something apk can actually read.
  #
  # continue-on-error because Pages has to be enabled once in the repository
  # settings.  A build that produced a perfectly good firmware must not be
  # marked failed because the optional hosting step was not configured yet.
  publish-apk-repo:
    name: 发布 apk 仓库
    needs: build
    # Always: the firmware's built-in source entry points here, so
    # publishing it is part of producing a usable firmware.
    #
    # Pinned, not `ubuntu-latest`: a floating label is a moving build
    # environment that can change under a release job with no commit to review,
    # and GitHub now annotates `ubuntu-latest` with the Ubuntu 26 migration
    # notice on every run.  Every other job in this repository already pins
    # `ubuntu-24.04`; this one was the only exception.
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the apk repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk-repo
          path: apk-repo

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          # Turn Pages on if it is off.  Without this the step dies with
          # "Get Pages site failed" and — because the job is continue-on-error so
          # that a hosting problem cannot fail a good build — the firmware ships
          # pointing at a URL that 404s, which is worse than pointing nowhere.
          enablement: true

      # A bare repository directory has no index.html, so the site root answers
      # 404 and looks broken even though packages.adb is served correctly.  This
      # page says what the directory is and how to point a router at it.
      # Publish the public key next to the index.  A device flashed before the
      # key was fixed carries a different key, and copying this one into
      # /etc/apk/keys/ is what lets it trust the repository without reflashing.
      - name: Check the signing public key is published
        run: |
          set -euo pipefail
          # The key is produced by the build and uploaded inside the apk-repo
          # artifact.  This job has no openwrt/ tree, so looking for it here —
          # which an earlier version did — always failed, and the site went out
          # without the key while every device kept reporting an untrusted
          # signature.
          if [ -s apk-repo/public-key.pem ]; then
            echo "public key present: $(wc -c < apk-repo/public-key.pem) bytes"
          else
            echo "::error::apk-repo/public-key.pem is missing; devices flashed from an earlier build cannot be given the key and will keep seeing an untrusted signature"
            exit 1
          fi

      - name: Write an index page
        run: |
          set -euo pipefail
          count="$(find apk-repo -maxdepth 1 -name '*.apk' | wc -l)"
          size="$(du -sh apk-repo | cut -f1)"
          cat > apk-repo/index.html <<EOF
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>H5000M apk 软件包仓库</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                     max-width: 46rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.7; }
              code { background: #f4f4f5; padding: .15em .35em; border-radius: .25rem; }
              pre  { background: #f4f4f5; padding: .8rem 1rem; border-radius: .4rem; overflow-x: auto; }
              h1   { font-size: 1.5rem; }
            </style>
          </head>
          <body>
            <h1>Hiveton H5000M 主线 OpenWrt 软件包仓库</h1>
            <p>这是固件自带的软件源，包含 <strong>${count}</strong> 个软件包，共 ${size}。
               内核模块与固件同一次构建产出，因此 ABI 完全匹配。</p>
            <p>索引地址：<a href="packages.adb">packages.adb</a></p>
            <h2>在路由器上使用</h2>
            <p>固件构建时已把这个地址写入 <code>/etc/apk/repositories.d/50-h5000m.list</code>，
               通常无需手动配置。若需手工添加：</p>
            <pre>echo 'https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/packages.adb' \\
            >> /etc/apk/repositories.d/customfeeds.list
          apk update
          apk add luci-app-passwall</pre>
            <p>可安装的代理面板包括 PassWall、PassWall2、HomeProxy、MosDNS、Nikki-RS、
               Momo、NeKoBox、v2rayA、OpenClash 以及各自的中文语言包。</p>
          </body>
          </html>
          EOF
          echo "index.html written ($(wc -c < apk-repo/index.html) bytes)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apk-repo

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # ---------------------------------------------------------------------------
  # Reusable Workflow call: run the firmware's own first-boot scripts against
  # the real aarch64 uci under qemu.
  #
  # This is the reuse boundary that matters on this project.  The first-boot
  # defaults have already shipped one bug that a shell mock could not catch (a
  # value stored as `'0'` instead of `0` — correct-looking config, radio stays
  # off), and the test needs a built rootfs.  Keeping it in its own reusable
  # workflow means build.yml calls it, a future release gate can call it with
  # a different artifact, and the test itself is not duplicated.
  #
  # `secrets: inherit` is deliberately NOT used: the callee declares no secrets
  # and needs none, so passing them would widen exposure for nothing.
  script-test:
    name: 设备脚本测试（复用工作流）
    needs: build
    # A called workflow's job can only use permissions the CALLER already has.
    #
    # This is not obvious and it fails in the worst possible way: the whole
    # workflow refuses to start, with no jobs and no error text.  Measured by
    # bisection — the callee asking for `actions: read` while this workflow only
    # granted `contents: read` produced
    #
    #   构建 H5000M 主线 OpenWrt 固件  completed/startup_failure
    #
    # `actions: read` is what `actions/download-artifact` needs in order to read
    # the artifact this job exists to test, so it has to be granted HERE.  It is
    # read-only, and scoped to this one job.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-script-test.yml
    with:
      artifact_name: H5000M-mainline-openwrt
      # Basename pattern: the callee passes it to `find -name`, which matches
      # the final path component only (a pattern with `/` never matches).
      tarball_glob: '*-targz-rootfs.tar.gz'

# higoros-qmodem: registered workflow (see QModem/OAF/HigoOS inputs above).
