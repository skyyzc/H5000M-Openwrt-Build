name: 仓库与主机检查

# Mainline OpenWrt (openwrt/openwrt main) for the Hiveton H5000M.
# Checks live in their own workflow so the badge reflects them and nothing
# else.  GitHub badges are per workflow, and shields.io's ?job= parameter is
# ignored — a bogus job name still renders "passing" — so a single workflow with
# several jobs can only ever show one badge.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC (Beijing 12:00)
  # pull_request is required for the Required Status Checks in the
  # master-protection ruleset to have anything to report: a branch
  # ruleset can only require a check that PRs actually run.
  pull_request:
  push:
    tags:
      - 'openwrt-*'
      - 'v*'
  workflow_dispatch:

# Concurrency: cheap and idempotent, so superseded runs are pure waste.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate: does this host have what the configuration stage needs, and is
  # the repository internally consistent?
  # ---------------------------------------------------------------------------
  check:
    name: 仓库与主机检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor artipacked: a checkout leaves GITHUB_TOKEN in .git/config,
          # where any later step — including a third-party package's build
          # script — can read it.  Nothing in these jobs pushes to the repo.
          persist-credentials: false

      - name: Install configuration-stage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip wget curl rsync zstd git patch python3

      - name: Check build host
        run: ./scripts/check-deps.sh

      - name: Workflow contracts (reusable workflows)
        run: |
          # A silent failure mode, made loud.  When build.yml calls a reusable
          # workflow whose job asks for permissions the caller does not grant,
          # GitHub refuses to start the ENTIRE workflow:
          #
          #   构建 H5000M 主线 OpenWrt 固件  completed/startup_failure
          #
          # with no jobs and no error text.  build.yml only runs on
          # schedule/tag/dispatch, so no PR gate ever sees it — this repository
          # shipped that bug and it took eight manual dispatches to bisect.
          # This step asserts the whole calling contract up front: the callee
          # exists, declares workflow_call, the caller passes only declared
          # inputs, the callee's permissions are a subset of the caller's,
          # no expression uses dot access on a hyphenated identifier, and no
          # `runs-on` uses a floating `*-latest` label (publish-apk-repo was the
          # repository's last one, and GitHub annotated it with the Ubuntu 26
          # migration notice on run 36282274537).
          ./scripts/check-workflow-contracts.sh

      - name: Action inputs are declared and nothing is deprecated
        run: |
          # The other silent failure mode, made loud.  Passing a `with:` key an
          # action does not declare does NOT fail the job — GitHub only leaves a
          # warning annotation:
          #
          #   Unexpected input(s) 'pull-request-title-pattern', valid inputs are [...]
          #
          # The workflow still runs and the check still goes green, so the setting
          # is dead while looking effective.  This repository shipped exactly
          # that: release-please.yml set `pull-request-title-pattern` and explained
          # in a comment that it made the release commit valid "by construction",
          # but the action never reads it (its `parseInputs()` takes a fixed list)
          # and the release PR was still titled `chore(master): release 1.1.4`.
          # What actually kept commitlint green was the `ignores` exception.
          #
          # Same shape, second class: an action (or one of its inputs) that has
          # been deprecated also only leaves a warning annotation.  Run
          # 36282274537 had two at once — `tool-cache` (renamed by
          # free-disk-space) and `actions/attest-sbom` (deprecated as a whole).
          # Both announcements live in the action's own metadata, so this step
          # checks them on the manifest it already downloaded, with no extra
          # network round trip.
          #
          # Remote actions are verified at their pinned SHA, which is immutable,
          # so the answer is stable.  An unresolvable action fails this step
          # rather than being skipped — a "pass" it could not verify is the exact
          # illusion the step exists to remove.
          ./scripts/check-action-inputs.sh

      # A gate that can no longer fail is worse than no gate: it reports success
      # while checking nothing, which is the same illusion the two steps above
      # exist to remove.  This is not hypothetical for check-action-inputs.sh —
      # its collection loop used to `continue` on any step without a `with:`
      # block, so a whole-action deprecation (the actions/attest-sbom shape)
      # would have been skipped entirely.
      #
      # Both scripts take a repo root, so each is pointed at a throwaway tree
      # that contains exactly the two defects they detect (a deprecated input on
      # a local action, and a floating `runs-on`).  Failing to fail is the bug.
      - name: The workflow gates themselves still detect their defects
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/.github/workflows" "$fixture/.github/actions/fixture"

          # Local action with one deprecated input.  Kept local on purpose: the
          # self-test must not need the network, or it would be skipped exactly
          # when a fetch-based gate is most likely to be broken.
          cat > "$fixture/.github/actions/fixture/action.yml" <<'YAML'
          name: fixture
          description: Fixture for the gate self-test; declares a deprecated input.
          inputs:
            old-name:
              description: Renamed input.
              deprecationMessage: use new-name instead
          runs:
            using: composite
            steps:
              - run: echo fixture
                shell: bash
          YAML

          # One job with the deprecated input, one with a floating runner label.
          cat > "$fixture/.github/workflows/x.yml" <<'YAML'
          name: fixture
          on: [push]
          jobs:
            fixture:
              runs-on: ubuntu-latest
              steps:
                - uses: ./.github/actions/fixture
                  with:
                    old-name: 'true'
          YAML

          fail=0
          expect_detect() {
            local name="$1" script="$2"
            if "$script" "$fixture" >/dev/null 2>&1; then
              echo "::error::${name} did NOT fail on the fixture — it has gone deaf"
              fail=1
            else
              echo "  OK    ${name} still detects its defect"
            fi
          }
          expect_detect check-action-inputs.sh ./scripts/check-action-inputs.sh
          expect_detect check-workflow-contracts.sh ./scripts/check-workflow-contracts.sh

          [ "$fail" -eq 0 ] || exit 1
          echo "both gates still detect the defects they exist to catch"

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all scripts parse"

      - name: bake_modem_support finds the panel data in any layout
        run: |
          set -euo pipefail
          # It located extra_modem_support.json by a hand-written path until
          # 2026-10-09, and the upstream repository nests the package one level
          # deeper than that path assumed (it reorganised its tree once before,
          # in 221f1a10).  The gate refused the build, which is the cheap
          # failure — nineteen minutes instead of a four-hour compile that
          # ships an image merging those entries at runtime — but the cause was
          # still a guess.  The location is discovered with `find` now, and this
          # step pins that: a fixed path goes red here, not in the build.
          #
          # It also pins the two refusal paths.  "Nothing found" and "two
          # candidates found" must both stop the build; picking one silently is
          # exactly the silent no-op the whole function exists to prevent.
          bash ./scripts/test-bake-modem-support.sh

      - name: ShellCheck (errors only)
        run: |
          set -euo pipefail
          # -S error: fail on real bugs (unbound variables, bad expansions) but
          # not on style.  This is the class of bug that `local a="$1" b="${a}"`
          # is: every argument is expanded before any of them is assigned.
          #
          # Coverage gap this closes: the step used to lint ONLY scripts/*.sh,
          # which left the nine device-side scripts under local-packages/
          # unchecked — and those are the ones that run as ROOT on the router
          # (first boot, USB hotplug, uci-defaults, the acceleration applier).
          # A bug there is strictly worse than one in a build script.
          mapfile -t files < <(
            printf '%s\n' scripts/*.sh
            find local-packages -type f \
              \( -path '*/usr/sbin/*' -o -path '*/uci-defaults/*' \
                 -o -path '*/hotplug.d/*' -o -path '*/etc/init.d/*' \) \
              -not -name '*.json' -not -name '*.js'
          )
          printf 'linting %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -S error "${files[@]}"

      - name: actionlint (workflow schema)
        run: |
          set -euo pipefail
          # Mirrors the pre-commit hook exactly (same version, same args), so a
          # contributor who runs `pre-commit install` cannot pass locally and
          # fail here.  `-shellcheck=` because shellcheck runs as its own step
          # over a wider file set.
          #
          # This is the tool that catches what a YAML parse cannot: the
          # `workflow_dispatch` 10-input ceiling (this repo had 13), `uses` and
          # `run` in one step, unknown expression contexts.
          # Download the pinned release and VERIFY its SHA256 before running it.
          #
          # `curl ... | bash` was what this did first, and Scorecard's
          # Pinned-Dependencies check (a Medium alert) is right to flag it: a
          # script fetched from a moving `main` branch executes arbitrary code
          # in a job that holds a repository token, and nothing verifies it.
          # A release tarball plus a checksum is the same convenience without
          # the moving part.
          version=1.7.7
          sha256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck= .github/workflows/*.yml

      - name: zizmor (workflow supply chain)
        run: |
          set -euo pipefail
          # Same version and persona as the security.yml job and the pre-commit
          # hook.  Kept here too so the CHEAP gate on every PR catches a
          # supply-chain regression without waiting for the security workflow.
          # Hash-pinned install.  A bare `zizmor==1.5.2` is version-pinned but
          # not integrity-pinned: PyPI could serve a rebuilt artifact under the
          # same version, and Scorecard's Pinned-Dependencies check flags exactly
          # that gap.  `pip --require-hashes` closes it.
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements-zizmor.txt
          zizmor --persona=auditor .github/workflows/

      - name: Verify target support upstream
        run: |
          set -euo pipefail
          # The whole project rests on openwrt/openwrt carrying this device.
          # Fail loudly here rather than 40 minutes into a build.
          . configs/upstream.env
          url="https://raw.githubusercontent.com/openwrt/openwrt/${OPENWRT_REPO_BRANCH}/target/linux/mediatek/image/filogic.mk"

          # Fetch into a variable rather than piping into `grep -q`.  With
          # `set -o pipefail`, `grep -q` exits as soon as it matches, curl is
          # killed by SIGPIPE, and the pipeline reports failure even though the
          # match succeeded:
          #
          #   curl: (23) Failure writing output to destination
          #   ##[error]hiveton_h5000m is not defined in ...
          #
          # which is what this step did on its first run against the real file.
          devices="$(curl -fsSL "$url")" \
            || { echo "::error::could not fetch ${url}"; exit 1; }
          case "$devices" in
            *"Device/${OPENWRT_PROFILE}"*)
              echo "found Device/${OPENWRT_PROFILE} on ${OPENWRT_REPO_BRANCH}" ;;
            *)
              echo "::error::${OPENWRT_PROFILE} is not defined in ${url}"
              exit 1 ;;
          esac

      - name: Verify tree patches still apply upstream
        run: |
          set -euo pipefail
          . configs/upstream.env
          git clone --depth 1 --branch "${OPENWRT_REPO_BRANCH}" \
            "${OPENWRT_REPO_URL}" /tmp/upstream-check
          status=0
          checked=0
          for p in patches/*.patch; do
            echo "--- $p"
            # Absolute: `git -C` changes the working directory, so a relative
            # patch path is looked up inside the clone instead of this checkout,
            # and git reports "can't open patch ... No such file or directory"
            # for a patch that is sitting right there.
            p="$(realpath "$p")"

            # Only patches against the OpenWrt tree itself can be checked here.
            # A patch may also target a feed package (0003-sing-box-pin used to,
            # before that pin became the scripted pin_sing_box rewrite in
            # scripts/local-build.sh), and this job clones the tree WITHOUT
            # installing any feed, so such a file would not exist and the check
            # would report "no longer applies to main" for a patch that was
            # perfectly fine.  Skip them, and say so, rather than fail.
            missing=0
            while IFS= read -r target; do
              case "$target" in
                feeds/*|package/feeds/*)
                  echo "    skipped: $target lives in a feed, which this check does not install"
                  missing=1
                  break
                  ;;
              esac
            done < <(git apply --numstat "$p" 2>/dev/null | awk '{print $3}')

            [ "$missing" = "1" ] && continue

            checked=$((checked + 1))
            if git -C /tmp/upstream-check apply --check "$p"; then
              echo "    applies"
            elif git -C /tmp/upstream-check apply --reverse --check "$p"; then
              echo "    already applied upstream"
            else
              echo "::error::patch $(basename "$p") no longer applies to ${OPENWRT_REPO_BRANCH}"
              status=1
            fi
          done
          echo "checked ${checked} tree patch(es)"
          exit $status

      # The three fullcone patches are not in patches/.  Their packages download
      # their own source into build_dir, so install_nftables_patches() copies each
      # one into that package's patches/ directory at build time — which means
      # nothing here verified them against the source upstream actually ships.
      #
      # That gap is expensive: nftables 1.1.6 -> 1.1.7 would not be noticed until
      # twenty minutes into a three-hour firmware build, and the failure would
      # read as a compile error.  This mirrors what the build does, but in the
      # cheap gate.
      #
      # The version and commit are read from the freshly cloned upstream tree, so
      # this follows a bump automatically instead of pinning our own copy.
      - name: Verify the fullcone patches still apply to the sources upstream ships
        run: |
          set -euo pipefail
          SRC=/tmp/upstream-check

          # Reuse the clone the previous step made; clone only if this step is
          # ever run on its own.
          if [ ! -d "$SRC" ]; then
            git clone --depth 1 --branch "${OPENWRT_REPO_BRANCH}" \
              "${OPENWRT_REPO_URL}" "$SRC"
          fi
          WORK=/tmp/fullcone-src
          rm -rf "$WORK"; mkdir -p "$WORK"
          status=0

          check_tarball() { # <package dir under the tree> <patch>
            local pkgdir="$1" patch="$2" name ver url file
            patch="$(realpath "$patch")"
            name=$(sed -n 's/^PKG_NAME:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            ver=$(sed -n 's/^PKG_VERSION:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            url=$(sed -n 's/^PKG_SOURCE_URL:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            file=$(sed -n 's/^PKG_SOURCE:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            url=${url//'$(PKG_NAME)'/$name}; url=${url//'$(PKG_VERSION)'/$ver}
            file=${file//'$(PKG_NAME)'/$name}; file=${file//'$(PKG_VERSION)'/$ver}

            echo "--- $(basename "$patch") against $name $ver"
            if ! curl -fsSL --retry 3 --max-time 120 -o "$WORK/$file" "$url/$file"; then
              echo "::error::cannot download $url/$file — upstream moved or renamed the source"
              status=1; return 0
            fi
            mkdir -p "$WORK/$name"
            tar -xf "$WORK/$file" -C "$WORK/$name" --strip-components=1
            if ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" >/dev/null ); then
              echo "    applies"
            else
              echo "::error::$(basename "$patch") no longer applies to $name $ver"
              ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" 2>&1 | head -6 ) || true
              status=1
            fi
          }

          check_git() { # <package dir under the tree> <patch> <repo url>
            local pkgdir="$1" patch="$2" repo="$3" name sha
            patch="$(realpath "$patch")"
            name=$(sed -n 's/^PKG_NAME:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            sha=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$SRC/$pkgdir/Makefile" | head -1)
            echo "--- $(basename "$patch") against $name ${sha:0:12}"
            rm -rf "${WORK:?}/${name:?}"; mkdir -p "$WORK/$name"
            git -C "$WORK/$name" init -q .
            git -C "$WORK/$name" remote add origin "$repo"
            if ! git -C "$WORK/$name" fetch -q --depth 1 origin "$sha"; then
              echo "::error::cannot fetch $repo at $sha — upstream dropped that commit"
              status=1; return 0
            fi
            git -C "$WORK/$name" checkout -q FETCH_HEAD
            if ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" >/dev/null ); then
              echo "    applies"
            else
              echo "::error::$(basename "$patch") no longer applies to $name ${sha:0:12}"
              ( cd "$WORK/$name" && patch -p1 --dry-run < "$patch" 2>&1 | head -6 ) || true
              status=1
            fi
          }

          check_tarball package/libs/libnftnl          libnftnl-patches/100-fullcone-expression.patch
          check_tarball package/network/utils/nftables nftables-patches/100-fullcone-expression.patch
          check_git     package/network/config/firewall4 firewall4-patches/100-fullcone-support.patch \
                        https://git.openwrt.org/project/firewall4.git

          echo
          if [ "$status" -ne 0 ]; then
            echo "one or more fullcone patches no longer apply upstream"
          fi
          exit $status

      - name: Verify the externally cloned repositories still exist
        env:
          # Authenticate the metadata call.  An unauthenticated request is
          # capped at 60/hour per source IP, and GitHub-hosted runners share
          # addresses, so the check intermittently failed with
          #   CHKayanami/OpenWrt-nikki-rs is not reachable (HTTP 403)
          # which is a rate limit, not a missing repository.  The workflow token
          # raises the cap to 5000/hour and is already available with the
          # workflow's `contents: read` permission.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # These are cloned straight from their upstreams into package/ at
          # build time, so a rename, a force-push to a different default branch,
          # or a deletion would only surface deep inside a build.  Check here.
          #
          # The list mirrors every clone in scripts/local-build.sh
          # (install_board_plugins, install_theme, install_external_packages,
          # install_proxy_repos and the QModem feed): the board plugins and the
          # theme are on the DEFAULT path, and the proxy trees are cloned on
          # every default build because ENABLE_REPO_PACKAGES defaults to on —
          # so a dead URL among them fails every build, not only the optional
          # profiles.  All entries verified reachable when this list was
          # extended (GitHub answers 200/301 for a live repository).
          fail=0
          for repo in \
            FAN789/luci-app-h5000m-fancontrol \
            FAN789/luci-app-h5000m-netmode \
            FAN789/luci-app-mt5700m \
            ddimension/openwrt-repo \
            CHKayanami/OpenWrt-nikki-rs \
            jerrykuku/luci-theme-argon \
            jerrykuku/luci-app-argon-config \
            coolsnowwolf/luci \
            Openwrt-Passwall/openwrt-passwall \
            Openwrt-Passwall/openwrt-passwall2 \
            Openwrt-Passwall/openwrt-passwall-packages \
            nikkinikki-org/OpenWrt-momo \
            fcshark-org/openwrt-fchomo \
            fw876/helloworld \
            immortalwrt/packages \
            immortalwrt/homeproxy \
            Thaolga/openwrt-nekobox \
            yichya/luci-app-xray \
            WROIATE/luci-app-hijpass \
            vernesong/OpenClash \
            sbwml/luci-app-mosdns \
            FUjr/QModem
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}")"
            if [ "$code" = "200" ]; then
              echo "ok   ${repo}"
            else
              echo "::error::${repo} is not reachable (HTTP ${code})"
              fail=1
            fi
          done
          exit $fail

      # The Nikki -> Nikki-RS switch and the eBPF kernel wiring are spread over
      # several files that no compiler checks together: a package token left as
      # the old `luci-app-nikki` is silently dropped by defconfig, and an eBPF
      # symbol that stops being emitted turns the Nikki-RS eBPF page into a
      # switch that cannot work.  Both are cheap to assert by text.
      - name: Verify the Nikki-RS and eBPF wiring is consistent
        run: |
          set -euo pipefail
          fail=0
          want() { if grep -q "$2" "$1"; then echo "  OK    $3"; else echo "  FAIL  $3"; fail=1; fi; }
          reject() { if grep -qE "$2" "$1"; then echo "  FAIL  $3"; fail=1; else echo "  OK    $3"; fi; }

          # The build clones the Rust monorepo, not the old mihomo tree.
          want scripts/local-build.sh 'CHKayanami/OpenWrt-nikki-rs.git' \
            "local-build.sh clones OpenWrt-nikki-rs"
          reject scripts/local-build.sh 'nikkinikki-org/OpenWrt-nikki\.git' \
            "local-build.sh no longer clones the mihomo Nikki"
          reject scripts/local-build.sh 'mihomo-meta' \
            "local-build.sh no longer emits mihomo-meta"

          # Package tokens.  Anchored so that `luci-app-nikki-rs` does not match.
          for f in scripts/local-build.sh scripts/verify-apk-repo.sh .github/workflows/build.yml; do
            reject "$f" 'luci-app-nikki([^-]|$)' "$f has no stale luci-app-nikki token"
          done
          want scripts/local-build.sh 'nikki-rs clash-rs luci-app-nikki-rs' \
            "local-build.sh emits the Nikki-RS stack"
          want scripts/local-build.sh 'luci-i18n-nikki-rs-zh-cn' \
            "local-build.sh emits the Nikki-RS translation"
          want scripts/verify-apk-repo.sh 'luci-app-nikki-rs' \
            "verify-apk-repo.sh checks the Nikki-RS front-end"
          want scripts/verify-apk-repo.sh 'clash-rs' \
            "verify-apk-repo.sh checks the clash-rs core"
          want .github/workflows/build.yml 'require_core luci-app-nikki-rs   clash-rs' \
            "build.yml requires clash-rs under the front-end"

          # The eBPF kernel half, and the TC modules it rides on.
          want scripts/local-build.sh 'ENABLE_EBPF_PROXY_KERNEL' \
            "local-build.sh has the eBPF kernel switch"
          want scripts/local-build.sh 'CONFIG_KERNEL_CGROUPS=y' \
            "local-build.sh requests CONFIG_KERNEL_CGROUPS"
          want scripts/local-build.sh 'CONFIG_KERNEL_CGROUP_BPF=y' \
            "local-build.sh requests CONFIG_KERNEL_CGROUP_BPF"
          want scripts/local-build.sh 'kmod-sched-bpf' \
            "local-build.sh carries the TC BPF modules"
          # BTF is required, and it has two prerequisites that are easy to lose:
          # DEBUG_INFO_REDUCED defaults to y and silently disables it.
          want scripts/local-build.sh 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' \
            "local-build.sh requests CONFIG_KERNEL_DEBUG_INFO_BTF"
          want scripts/local-build.sh 'CONFIG_KERNEL_DEBUG_INFO_REDUCED' \
            "local-build.sh explicitly disables CONFIG_KERNEL_DEBUG_INFO_REDUCED"
          want .github/workflows/build.yml 'CONFIG_KERNEL_DEBUG_INFO_BTF' \
            "build.yml asserts BTF survived into the kernel config"
          want scripts/local-build.sh 'kmod-veth' \
            "local-build.sh installs kmod-veth (the eBPF link pair)"
          want scripts/verify-apk-repo.sh 'kmod-veth' \
            "verify-apk-repo.sh checks kmod-veth"
          want configs/h5000m.config 'ENABLE_EBPF_PROXY_KERNEL' \
            "h5000m.config documents the eBPF switch"

          # The acceleration page owns the kernel-side prerequisites and reports
          # readiness; the actual on/off stays with Nikki-RS via a tristate.
          accel=local-packages/luci-app-h5000m-accel
          want "$accel/root/etc/config/h5000m_accel" 'ebpf_proxy' \
            "the accel config has the eBPF option"
          want "$accel/root/usr/sbin/h5000m-accel" 'cls_bpf' \
            "the accel apply script loads cls_bpf"
          want "$accel/root/usr/sbin/h5000m-accel" 'modprobe veth' \
            "the accel apply script loads veth"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ebpf_kernel' \
            "the accel status script reports eBPF readiness"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ls -d /sys/module/nf_flow_table' \
            "the accel status counts module dirs, not their contents"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ebpf_veth' \
            "the accel status script reports veth readiness"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ebpf_datapath' \
            "the accel status script reports the eBPF datapath interface"
          want "$accel/htdocs/luci-static/resources/view/h5000m/accel.js" 'ebpf_datapath' \
            "the accel page distinguishes datapath-up from log-confirmed attach"
          want "$accel/htdocs/luci-static/resources/view/h5000m/accel.js" 'ebpf_proxy' \
            "the accel page exposes the eBPF option"
          want "$accel/Makefile" 'kmod-sched-bpf' \
            "the accel package depends on the TC BPF module"
          want "$accel/Makefile" 'kmod-veth' \
            "the accel package depends on kmod-veth"

          # The eBPF bypass list has to name the router's own IPv6, in two places
          # that fail independently: the static defaults this project patches at
          # build time, and the device-side applier that derives the real LAN
          # prefixes.  This is the failure reported as "开启 eBPF 后 IPv6 地址相关
          # 的解析出问题": upstream ships only ::1/128, fe80::/10 and ff00::/8 on
          # the IPv6 side, so traffic addressed to the router itself is captured
          # while its IPv4 twin is bypassed by 192.168.0.0/16.
          want scripts/local-build.sh 'patch_nikki_ebpf_bypass_defaults' \
            "local-build.sh patches upstream's eBPF bypass defaults"
          # A default that is never applied is the same as no default.
          want scripts/local-build.sh '^	patch_nikki_ebpf_bypass_defaults$' \
            "the eBPF bypass default patch is called from main"
          want scripts/local-build.sh "bypass_dst_ips 'fc00::/7'" \
            "the shipped default carries the ULA range"
          # Scoped, or the file-wide insert would also hit the section-creation
          # list, which already has the entry this is meant to add.
          want scripts/local-build.sh 'insert_in_default_block' \
            "the LuCI default edit is scoped to the field's own array"
          # The page's default had also lost 192.168.0.0/16 — the IPv4 safety net
          # docs/engineering.md calls mandatory.
          want scripts/local-build.sh "'192.168.0.0/16'," \
            "the page default gets the IPv4 LAN back"
          want "$accel/root/usr/sbin/h5000m-accel" 'EBPF_BYPASS_ALWAYS' \
            "the accel applier knows the ULA safety net"
          want "$accel/root/usr/sbin/h5000m-accel" 'apply_ebpf_bypass_ips' \
            "the accel applier repairs the bypass list"
          want "$accel/root/usr/sbin/h5000m-accel" '/proc/net/if_inet6' \
            "the accel applier derives LAN prefixes without depending on ip"
          # A call on a line of its own, which the definition (name + `() {`)
          # cannot match.  It is in the apply branch rather than inside
          # apply_settings on purpose: that function returns early when
          # firewall.@defaults[0] is missing, and this repair must not.
          want "$accel/root/usr/sbin/h5000m-accel" '^[[:space:]]*apply_ebpf_bypass_ips$' \
            "the repair runs from the accel apply path"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ebpf_core_ipv6' \
            "the accel status reports the core's own IPv6 switches"
          want "$accel/root/usr/sbin/h5000m-accel-status" 'ebpf_bypass_ipv6' \
            "the accel status reports IPv6 bypass coverage"
          want "$accel/htdocs/luci-static/resources/view/h5000m/accel.js" 'ebpf_bypass_ipv6' \
            "the accel page shows the IPv6 bypass coverage"
          # uci prints a list on ONE line (cli.c: uci_show_value), so a whole-line
          # comparison never matched and every apply appended a second copy of
          # every entry.  The applier matches tokens instead, and the harness
          # scenario is what would catch a regression — it only works against the
          # firmware's own uci, not a mock.
          want "$accel/root/usr/sbin/h5000m-accel" 'case "$cur" in' \
            "the applier compares bypass entries as tokens, not whole lines"
          want scripts/rootfs-script-test.sh 'a second apply adds nothing' \
            "the harness still exercises the bypass dedupe against the real uci"

          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::Nikki-RS / eBPF wiring is inconsistent"
            exit 1
          fi
          echo "Nikki-RS and eBPF wiring is consistent."

      # The eBPF config schema is generated by one project (the LuCI feed) and
      # consumed by another (the prebuilt clash-rs core), and the two are
      # versioned independently.  The feed's `main` gained
      # `ebpf.lan.proxy-src-macs` in commit 424abb38 (2026-09-26); the core only
      # learned that field in v0.20.10-alpha, while the feed's Makefile still
      # pinned v0.20.0-alpha.
      #
      # clash-rs is started WITHOUT --strict-config (verified against the feed's
      # init script), so this does not crash — it silently drops the field.  The
      # user ticks "Proxy Client MACs", UCI stores it, and every LAN client gets
      # proxied instead of only the listed ones.  A security control reporting
      # success while doing nothing.
      #
      # These assertions are text-level on purpose: resolving it properly means
      # downloading the pinned binary, which no PR check should do.  They catch
      # the failure mode that matters — the pin being reverted or dropped.
      - name: Verify the clash-rs pin covers the eBPF fields the feed emits
        run: |
          set -euo pipefail
          fail=0
          want() { if grep -q "$2" "$1"; then echo "  OK    $3"; else echo "  FAIL  $3"; fail=1; fi; }

          want scripts/local-build.sh 'pin_clash_rs' \
            "local-build.sh has the clash-rs pin"
          # The exact version the field-skew analysis concluded with.  Bumping
          # this is fine; removing it, or dropping to a version without
          # proxy-src-macs, is the regression.
          want scripts/local-build.sh 'want_v="0.20.10_alpha"' \
            "the pin names a core version that understands proxy-src-macs"
          want scripts/local-build.sh 'releases/download/v0.20.10-alpha/' \
            "the pin points at the matching release"
          # The pin is a no-op if it never runs.
          want scripts/local-build.sh '^	pin_clash_rs$' \
            "pin_clash_rs is called from main"
          # The feed is cloned from a moving branch, so the generated schema can
          # change without this repository changing at all.  Recording that fact
          # here is what makes the pin meaningful rather than incidental.
          want scripts/local-build.sh 'OpenWrt-nikki-rs.git main' \
            "the Nikki-RS feed is still cloned from the moving main branch"
          # Every architecture hash has to be a 64-hex sha256; a truncated or
          # placeholder hash would keep the OLD tarball (same filename, no
          # version in it) and ship the wrong core with a green build.
          n=$(grep -cE '^	local (aarch64|x86_64|armv7|riscv64|i686)_h="[0-9a-f]{64}"$' scripts/local-build.sh)
          if [ "$n" -eq 5 ]; then
            echo "  OK    all 5 architecture hashes are full sha256 values"
          else
            echo "  FAIL  expected 5 full sha256 architecture hashes, found ${n}"
            fail=1
          fi
          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::the clash-rs pin is incomplete — the eBPF MAC allowlist would silently do nothing"
            exit 1
          fi
          echo "The clash-rs pin covers the eBPF schema the feed generates."

      # adblock-fast's two complaints on a real device were "gawk, grep, sed,
      # coreutils-sort are missing" (its recommended-package probe only knows the
      # GNU paths) and "dnsmasq.ipset is not supported" (no ipset tool/module).
      # Both are fixed in the build script and the repository/release checks;
      # this asserts the fix stays wired together.
      - name: Verify the adblock DNS backends are wired consistently
        run: |
          set -euo pipefail
          fail=0
          want() { if grep -q "$2" "$1"; then echo "  OK    $3"; else echo "  FAIL  $3"; fail=1; fi; }

          # Image: dnsmasq-full (ipset + nftset) and the ipset tool/module.
          want scripts/local-build.sh 'CONFIG_PACKAGE_dnsmasq-full=y' \
            "local-build.sh installs dnsmasq-full"
          want scripts/local-build.sh 'CONFIG_PACKAGE_ipset=y' \
            "local-build.sh installs the ipset tool"
          want scripts/local-build.sh 'CONFIG_PACKAGE_kmod-ipt-ipset=y' \
            "local-build.sh installs kmod-ipt-ipset"
          want scripts/local-build.sh 'REQUIRED_PACKAGES+=(dnsmasq-full ipset kmod-ipt-ipset)' \
            "local-build.sh verifies the adblock DNS backends survive defconfig"

          # Repository: the adblock-fast stack and the four recommended tools.
          want scripts/local-build.sh 'adblock-fast luci-app-adblock-fast luci-i18n-adblock-fast-zh-cn' \
            "local-build.sh emits the adblock-fast stack"
          want scripts/local-build.sh 'gawk grep sed coreutils-sort' \
            "local-build.sh emits adblock-fast's recommended tools"

          want scripts/verify-apk-repo.sh 'luci-app-adblock-fast' \
            "verify-apk-repo.sh checks the adblock-fast front-end"
          want scripts/verify-apk-repo.sh 'adblock-fast' \
            "verify-apk-repo.sh checks the adblock-fast service"
          want scripts/verify-apk-repo.sh 'kmod-ipt-ipset' \
            "verify-apk-repo.sh checks kmod-ipt-ipset"
          want scripts/verify-apk-repo.sh 'DNS_BACKENDS=(dnsmasq-full ipset)' \
            "verify-apk-repo.sh checks the DNS backends"
          want scripts/verify-apk-repo.sh 'ADBLOCK_TOOLS=(gawk grep sed coreutils-sort)' \
            "verify-apk-repo.sh checks the recommended tools"
          # The paths, not the presence, are what clears adblock-fast's warning: a
          # presence check stays green even if upstream moves grep-gnu somewhere
          # the probe never looks, which is the silent failure this asserts against.
          want scripts/verify-apk-repo.sh 'ADBLOCK_TOOL_PATHS' \
            "verify-apk-repo.sh checks the paths adblock-fast probes"

          want .github/workflows/build.yml 'luci-app-adblock-fast' \
            "build.yml checks the adblock-fast front-end"
          want .github/workflows/build.yml 'require_core luci-app-adblock-fast adblock-fast' \
            "build.yml requires adblock-fast under the front-end"

          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::adblock DNS backend wiring is inconsistent"
            exit 1
          fi
          echo "adblock DNS backend wiring is consistent."

      # A build-time measurement, not a style rule: luci-theme-spectra is a pure
      # CSS/JS theme whose Makefile declares +php8 +php8-cgi +ffmpeg.  Emitting
      # it dragged ffmpeg into the build, and ffmpeg alone was ~72 of the 211
      # minutes a full build measured — 34% of the run.  It is not in the README
      # and nothing selects it, so it stays out; this keeps it out on purpose.
      - name: Verify the heavyweight optional theme is not built
        run: |
          set -euo pipefail
          fail=0
          if grep -qE '^[^#]*emit_service.*luci-theme-spectra' scripts/local-build.sh; then
            echo "  FAIL  luci-theme-spectra is emitted again (pulls php8 + ffmpeg; ~72 min of build)"
            fail=1
          else
            echo "  OK    luci-theme-spectra is not emitted"
          fi
          if grep -qE '^[^#]*[[:space:]]emit_service|^[[:space:]]*luci-theme-spectra[[:space:]]*\\?$' scripts/local-build.sh \
             && grep -qE '^[[:space:]]*luci-theme-spectra[[:space:]]*\\?$' scripts/local-build.sh; then
            echo "  FAIL  luci-theme-spectra still appears in an emit list"
            fail=1
          else
            echo "  OK    luci-theme-spectra is absent from every emit list"
          fi
          # The theme's cost only stays out if ffmpeg is not requested by name
          # anywhere else in the build either.
          if grep -qE '^[^#]*emit_service.*\bffmpeg\b' scripts/local-build.sh; then
            echo "  FAIL  ffmpeg is emitted by name"
            fail=1
          else
            echo "  OK    ffmpeg is not emitted by name"
          fi
          # The host-tool half of the toolchain cache is what stops cmake and
          # friends from being rebuilt every run.
          if grep -q 'build_dir/host' .github/workflows/build.yml \
             && grep -q 'exclude=.build_dir/host/rustc' .github/workflows/build.yml; then
            echo "  OK    build_dir/host is cached (minus the rust host tree)"
          else
            echo "  FAIL  build_dir/host is not cached, or the rust exclusion was dropped"
            fail=1
          fi
          # A rejected cache has to be REMOVED, not merely reported: leaving a
          # partial 9 GB blob behind makes the next transfer pointless.
          if grep -q 'cache is complete and intact' .github/workflows/build.yml; then
            echo "  OK    the build cache is validated and rejected copies are removed"
          else
            echo "  FAIL  the build cache is not pre-validated in the workflow"
            fail=1
          fi
          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::the heavyweight theme / cache wiring regressed"
            exit 1
          fi
          echo "The heavyweight optional theme is not built and the caches are wired."

      # A real device found this one: kmod-nft-fullcone was installed and
      # CONFIG_PACKAGE_kmod-nft-fullcone was =y, yet nft_fullcone.ko did not
      # exist and `modprobe nft_fullcone` answered "failed to find a module".
      # CONFIG_NFT_FULLCONE is not a symbol the kernel's own Kconfig knows, so
      # `make syncconfig` strips it and include/kernel.mk generates an empty
      # package.  local-packages/nft-fullcone/Makefile re-declares the symbol
      # for the packaging decision; this asserts that workaround and the
      # build-time gate that proves the module is staged.
      - name: Verify the fullcone module packaging workaround is present
        run: |
          set -euo pipefail
          fail=0
          want() { if grep -q "$2" "$1"; then echo "  OK    $3"; else echo "  FAIL  $3"; fail=1; fi; }

          want local-packages/nft-fullcone/Makefile '^CONFIG_NFT_FULLCONE=m$' \
            "nft-fullcone Makefile sets CONFIG_NFT_FULLCONE for the install rule"
          want local-packages/nft-fullcone/Makefile 'nft_fullcone.$(LINUX_KMOD_SUFFIX)' \
            "nft-fullcone Makefile still declares the module file"
          want .github/workflows/build.yml 'kmod-nft-fullcone carries nft_fullcone.ko' \
            "build.yml asserts the module is really in the package"
          want .github/workflows/build.yml 'kmod-nft-fullcone in the assembled rootfs' \
            "build.yml asserts the module is in the rootfs"

          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::the fullcone module packaging workaround is missing"
            exit 1
          fi
          echo "the fullcone module packaging workaround is present."

  # ---------------------------------------------------------------------------
  # Conventional Commits.  The commit log IS the release log here: Release
  # Please derives the version bump and the changelog from it, and build.yml
  # names firmware releases after the upstream revision.  A mislabelled commit
  # therefore becomes a wrong release note, so the message format is a gate and
  # not a preference.
  #
  # Runs against the PR's commit range rather than HEAD: commitlint is about
  # every commit that will land, not just the tip.
      # 失败时自动产出诊断报告（可复用的 Composite Action）
      # —— 三个 workflow 此前没有任何失败诊断步骤，红了的 run 只显示
      #    "exit code 1"，原因必须本地复现。
      - name: 失败诊断
        if: failure()
        uses: ./.github/actions/diagnose
        with:
          title: 仓库与主机检查失败
  commitlint:
    name: 提交信息规约
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history is needed to walk the commit range.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install commitlint
        run: |
          set -euo pipefail
          # `npm ci` against a committed lockfile, not a floating `npm install`.
          #
          # Scorecard's Pinned-Dependencies check flags an install that is not
          # integrity-pinned.  A package-lock.json carries an `integrity`
          # (sha512) for every package in the tree, and `npm ci` refuses to
          # install anything that does not match it — the same guarantee the
          # pip --require-hashes file gives on the Python side.
          npm ci --no-audit --no-fund --ignore-scripts
          npx commitlint --version

      - name: Lint the commits
        env:
          # Passed through the environment rather than interpolated into the
          # shell: `${{ github.event... }}` inside a `run:` is the classic
          # script-injection vector (a branch named `$(rm -rf /)` would execute),
          # and zizmor's template-injection rule flags it.  An env var is data.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            # Not a PR (schedule/dispatch/tag): lint the tip commit, which is
            # the one this run was triggered by.
            echo "no PR range; linting HEAD"
            npx commitlint --config commitlint.config.mjs --from HEAD~1 --to HEAD --verbose
          else
            echo "linting ${BASE_SHA}..${HEAD_SHA}"
            npx commitlint --config commitlint.config.mjs --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
          fi

      # 失败时自动产出诊断报告（可复用的 Composite Action）
      # —— 三个 workflow 此前没有任何失败诊断步骤，红了的 run 只显示
      #    "exit code 1"，原因必须本地复现。
      - name: 失败诊断
        if: failure()
        uses: ./.github/actions/diagnose
        with:
          title: 提交信息规约失败